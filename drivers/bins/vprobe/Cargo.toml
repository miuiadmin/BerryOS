[package]
name = "vprobe"
version.workspace = true
edition = "2021"

# P6 A-2：virtio-mmio 探测程序（用户态驱动地基第一刀——`docs/文件系统
# 设计.md` §6 P6 后续的块设备前置）。stdhello/fsmgr 同链（musl target +
# berry-libc shim）。svcmgr 经 `SpawnSpec::mmio_vmo` 把 boot 授能的 MMIO
# 窗口 VMO 映到 `VIRTIO_MMIO_VA`（berry-exec 单源常量）；本程序只读
# virtio-mmio 规范头四字断言 transport 在席（magic/version/device_id），
# VendorID 只打印不断言（0x554D4551 "QEMU" 是仿真器特有值）。成功打
# `VIRTIO ok`（rootfs 相第 12 标记）后 main 返回 = exit(0)，svcmgr reap。
# 2026-10-24 自 user/bins/ 迁入 drivers/（工作区成员——空 [workspace]
# 自绝表与自带 [profile.release] 随迁退役，profile 集中到 drivers/
# Cargo.toml 根，逐值相同 = 产物零漂移）。
license = "Apache-2.0"

[dependencies]
berry-libc = { path = "../../../user/berry-libc" }
berry-sys = { path = "../../../user/berry-sys" }
berry-exec = { path = "../../../user/berry-exec" }
# HAL 接线（2026-11-18）：MMIO 读写经 berry-hal 的 Mmio trait + VirtioMmio
# 实现——volatile/窗界检收敛在 HAL 实现内部，本 bin 零 MMIO unsafe（HAL
# crate 的首个真消费者，消「HAL 落地零驱动使用」空转）。跨工作区 path
# （drivers→user）先例 = 上三行 user 侧 crate 同款，锁独立互不污染。
berry-hal = { path = "../../../user/berry-hal" }
# 探测判据的偏移/鉴定值单源（MAGIC/VERSION/DEVICE_ID/VENDOR_ID 偏移 +
# MAGIC_VAL/VERSION_MODERN/DEVICE_ID_* 鉴定值）——vblk 同款「引常量不
# 复制」；本地六常量镜像（VIRTIO_MAGIC/VERSION/DEV_BLOCK/NET/INPUT/GPU）
# 随 HAL 接线退役。
berry-virtio = { path = "../../berry-virtio" }
