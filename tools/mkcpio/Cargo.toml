[package]
name = "mkcpio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "BerryOS cpio newc 打包器（rootfs 产出端，彻底 Rust 化轨道 b 层 #8 刀序首位）"

[lib]
name = "mkcpio"
path = "src/lib.rs"

[[bin]]
name = "mkcpio"
path = "src/main.rs"

# 零依赖纪律（W1 lane：禁新外部依赖）——纯 std，与 tools/elf2flat、tools/berry
# 同款独立小工作区形态（根 .cargo/config.toml 锁 build.target=aarch64-unknown-none，
# 宿主件靠 --manifest-path + 显式 --target 走 host 面）。
[dependencies]

# 独立小工作区标记（tools/berry 同款形态——根 workspace 自动上溯在此截断）
[workspace]
