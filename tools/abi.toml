desc = '查询 effective 调度属性（Thread = Process 默认 ∪ Thread 覆盖；declared/source 走 telemetry；size 前向兼容）'
stage = "1.1"
implemented = true
note = 'S1 收口：effective 组合 + 前向兼容回写（尾部清零）已落。'
[[group.syscall]]
num = 0x3E
