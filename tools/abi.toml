desc = '声明/更新调度属性（weight/policy/intent/reserve/cap/deadline/budget/period）；目标 Thread 覆盖 / Process 默认；size 超界且尾部非零 → -E2BIG'
stage = "1.1"
implemented = true
note = 'S1 收口：56B attr 解析/校验/存储（Thread 覆盖 + Process 默认）已落；S2/S5 消费随后续刀。'
[[group.syscall]]
num = 0x3D
