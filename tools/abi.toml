[[group.syscall]]
num = 0x3F
name = "thread_yield"
desc = '主动让出当前时间片；无 handle，等价内核 yield_now；无可跑任务立即返回 0'
stage = "1.1"
implemented = true
note = 'S1 收口：SVC 面 direct yield_now（含切换锁舞蹈）已落。'

