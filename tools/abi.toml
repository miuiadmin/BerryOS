# =====================================================================
# BerryOS ABI 单一事实源（常量层 IDL，2026-10 落地）
# ---------------------------------------------------------------------
# 产物（`python3 tools/gen_abi.py` 生成，`--check` 逐字节守卫——挂
# `just abi-check` + smoke + build 前置）：
#   1. kernel/src/abi_gen.rs           —— NR/CLOCK/CHAN_OPT/RIGHT/SIGNAL/ERR
#   2. user/berry-sys/src/abi_gen.rs —— 同面镜像（+ INVALID_HANDLE + mod nr）
#   3. docs/系统调用ABI设计-v1.0.md  —— §4 编号表体 + §8.2 C 定义列（marker 块）
#   4. tools/abi.syz                  —— syzkaller 描述骨架（SEC-01 §4.5 件 25；
#                                       未过 syz-sysgen 编译验证——头注如实声明）
#   5. arch/aarch64/src/wake_gen.rs  —— 唤醒源枚举常量（刀 1：内核 wakeup 记账
#                                       面；trap 臂/cell 初值消费；PM-17 终审问① A1）
# 五面同源 ⇒ 漂移按构造不可能；--check 只拦「改了本文件忘再生成 / 手改产物」。
# Plan B v0.5 的 abi_check.py 三方对账关卡随之退役（生成即一致）。
#
# 改 ABI 的流程：改本文件 → `just abi-gen` → 提交（产物 diff 一并入册）。
# 范围注记：本源只覆盖**常量层**（号/位/码/宽度）；§8.3 原型层（berry_* 签名
# 与 .h）仍手写双镜像——v2 挂账（见 ABI 文档 §8 引言）。
# =====================================================================

# ---- 平台 API level（VER-01 提案第 4 条·「1.0 前 SDK 冻结窗」刀：SDK
# CURRENT 布尔门槛 → 单调整数 level 轨道，Android API level 形而更简——
# 无多 level 并存）。调律：只增不减；每次不兼容 ABI 变更 +1；兼容新增
# 不 +1（Android API level 语义）。消费面：两端 abi_gen 的
# BERRY_PLATFORM_LEVEL（svcmgr 装载期与 .bap [compat] min_level 比较的
# 基线）。与 [compat] 三值域（semver 形，ADR #55）正交并行——互不替代、
# 各自版本化。----
[platform]
level = 1             # 初值 1 = 首个冻结面起点（v1 37 号在册面）

[meta]
stage = "v1"
nr_total = 37        # v1 在册号数（生成器校验 = 下方 stage="v1" 行数；含 0x85
                     # berry_attest 在册未实现预留位——SEC-01 件 11；含 0x86/0x87
                     # 信号面——A7-4 门 C 裁定 A add-only 加号；含 0x23
                     # pager_supply_mapped——G4-4 门 C 裁 A add-only 加号；含 0x24
                     # pager_supply_mapped_table——X-6 刀① 批供表批加号）
implemented = 36     # 已实现（T-1 后在册真语义全实现 + A7-4 段②信号两号翻真 +
                     # G4-2 0x21 pager_supply_pages v2 号激活 + G4-4 X-3b
                     # 0x23 pager_supply_mapped 挂派发翻真 + X-6 刀①
                     # 0x24 pager_supply_mapped_table 挂派发；
                     # 唯 0x85 berry_attest 预留位恒 -ENOTSUP——与未知号同形，
                     # ABI §8.0 永不 panic 执法）
nr_ceiling = 45      # syscall 号面帽上界（ADR #11「~30–45」上限端）。生成器执法
                     # nr_defined（v1+1.1 常量层行数）≤ 本值，并把四元组
                     # nr_total/nr_defined/nr_registered/nr_ceiling 打进两端
                     # abi_gen 头注——预算口径唯一收口处（刀 1 前置 #8：消灭
                     # 35/39/38 三口径打架的文档面；PM-17 终审 §4 裁 B 机制）

# ---- 唤醒源枚举（刀 1：内核 wakeup 记账面；PM-17 终审问①裁 A1 静态穷举）----
# add-only 纪律：新源只追加（不改值/不改义/不复用退役值）；0x08–0x7E 为预留段
#（0x07 自 sim-S2 A4② 起为 POWER_KEY 占用），值域 u8 且 ≤ 0x7F。生成：arch/aarch64/src/wake_gen.rs（第五产物）；内核
# telemetry per-source 记账与用户侧 berry-power（0x84 telemetry_open 快照面，
# 落地刀再生用户侧常量——本刀只冻形状）同源同值。语义详注 →
# research/pm-notes/刀1-前置两问-裁决.md §5 与 docs/内核唤醒记账设计（刀 1 落库）。

[[wakesrc]]
name = "NONE"
expr = "0x00"
desc = '哨兵：未接线语境（仅 CPU1 首任务切入前窗口可持有）；到达 on_wake = 绊网 panic（写点 L0 执法，负延迟同族）。'
[[wakesrc]]
name = "KERNEL_BOOT"
expr = "0x01"
desc = 'boot 期非 IRQ 语境（rust_main 直跑窗的 spawn/唤醒）；首任务切入后冻结——G1.5 断言其不再增长（无主-3 空类证明）。'
[[wakesrc]]
name = "TIMER"
expr = "0x02"
desc = 'CNTV PPI 27（tick 重编程与超时到期唤醒——expire_timeouts 路径）。'
[[wakesrc]]
name = "UART_RX"
expr = "0x03"
desc = 'PL011 SPI 33（控制台 RX 到达唤醒——rx_irq_notify 路径）。'
[[wakesrc]]
name = "SGI_RESCHED"
expr = "0x04"
desc = 'SGI 1（跨核重调度投递）。'
[[wakesrc]]
name = "SGI_TLB"
expr = "0x05"
desc = 'SGI 2（TLB shootdown 收端——无唤醒路径，只计到达）。'
[[wakesrc]]
name = "IPC"
expr = "0x06"
desc = '任务语境基线：SVC/同步异常/内核任务（note_switch 切入即设）语境的一切 wake_matching 唤醒。'
[[wakesrc]]
name = "POWER_KEY"
expr = "0x07"
desc = 'PL061 GPIO3 电源键（sim-S2 A4②：QEMU virt gpio-keys/poweroff，SPI 7=GIC INTID 39，QMP system_powerdown 脉冲）。v1 无主到达：只进 IRQ 级记账 + no_waiter 台账（unowned），恒无唤醒——永不进环（wake_src_valid 有意不含本源，到达-only 三号位与 NONE/UNKNOWN 同类；进环即 wake_check ⑤ 红）。'
[[wakesrc]]
name = "UNKNOWN"
expr = "0x7F"
desc = '未知 IRQ 号（GIC IAR 落未知臂）：只进 IRQ 级到达计数、永不进环；到达 on_wake = 写路径 bug → panic。'

# G2 冻结面：基础类型宽度（生成两端 const assert——「CI 结构体布局断言」的
# v1 标量层；真 ABI 结构体出现即在此入册同源）。
[types]
handle = 4           # berry_handle_t / Handle = u32（G-eco-c copy_out_u32 的根源）
rights = 8           # berry_rights_t / Rights = u64
status = 4           # berry_status_t / Status = i32
time = 8             # berry_time_t / Time = u64
invalid_handle = 0   # BERRY_HANDLE_INVALID / INVALID_HANDLE

[[clock]]
name = "MONOTONIC"
expr = "0"
desc = '`clock_read` 的 clock_id：v1 只有单调钟（`berry_time_t` = 纳秒；壁钟留 v2）。'
desc_user = '`clock_read` 的 clock_id：v1 只有单调钟（壁钟留 v2）。'

[[option]]
name = "CHAN_OPT_NO_INTENT"
scope = "channel_create"
expr = "1 << 0"
desc = '''`channel_create` options bit0（4-3c，五件套之 4）：intent opt-out——置位通道
的 recv 不结算 intent（QNX `_NTO_CHF_FIXED_PRIORITY` 等价，系统服务/看门狗
类 server 逃生门）。其余位保留（非 0 尾 → -EINVAL，options 纪律）。'''

[[option]]
name = "VMO_OPT_DEMAND"
scope = "vmo_create"
expr = "1 << 0"
desc = '''`vmo_create` options bit0（G4-2，§5-① 裁决）：按需后备 VMO——创建即
demand 对象属性 + 额外授 RIGHT_SET_POLICY（在册未消费位首消费；0x21 pager 面
门权）。映射走 vmar_map 对象级分流 map_demand（首触缺页由 EL0 pager 供给）。
其余位保留（非 0 尾 → -EINVAL，options 纪律）。'''

# ---- rights 位（能力模型 §2；位表是 ABI 冻结值，未消费位先全量在册）----

[[right]]
name = "READ"
expr = "1 << 0"
desc = ""
[[right]]
name = "WRITE"
expr = "1 << 1"
desc = ""
[[right]]
name = "EXECUTE"
expr = "1 << 2"
desc = ""
[[right]]
name = "MAP"
expr = "1 << 3"
desc = ""
[[right]]
name = "DUPLICATE"
expr = "1 << 4"
desc = ""
[[right]]
name = "TRANSFER"
expr = "1 << 5"
desc = ""
[[right]]
name = "INSPECT"
expr = "1 << 6"
desc = ""
[[right]]
name = "SIGNAL"
expr = "1 << 7"
desc = '3-4c 起消费：`object_signal` 门控（Event 置/清位）。'
[[right]]
name = "SEND"
expr = "1 << 8"
desc = '3-4b 起消费：`channel_send` 门控。'
[[right]]
name = "RECV"
expr = "1 << 9"
desc = '3-4b 起消费：`channel_recv` 门控。'
[[right]]
name = "MANAGE"
expr = "1 << 10"
desc = ""
[[right]]
name = "SET_POLICY"
expr = "1 << 11"
desc = ""
[[right]]
name = "SAME"
rust = "RIGHTS_SAME"
c = "BERRY_RIGHT_SAME_RIGHTS"
expr = "u64::MAX"
desc = '`handle_duplicate`「取原权利全集」哨兵（= `BERRY_RIGHT_SAME_RIGHTS`，全 1）。'
desc_user = 'duplicate 的「不裁剪」哨兵（内核同值 u64::MAX；实际授权仍受 handle 既有位约束）。'
c_note = "duplicate 时取全集的哨兵"

# ---- wait 信号位（4-2 位空间：低 32 内核派生 + 高 32 用户）----

[[signal]]
name = "READABLE"
expr = "1 << 0"
desc = 'Channel 端点可读：**本端**队列非空（内核派生位——用户 signal 不出此位）。'
[[signal]]
name = "WRITABLE"
expr = "1 << 1"
desc = 'Channel 端点可写：**对端**队列未满（内核派生位）。'
[[signal]]
name = "TERMINATED"
expr = "1 << 2"
desc = '''Process 已退出（Plan B v0.5 内核派生位；Exited 置位时唤醒，永久置位——
同 Zircon TASK_TERMINATED 口径；父进程 wait 到该位后 unmap/close 回收）。'''
[[signal]]
name = "WAKE_PENDING"
expr = "1 << 3"
desc = '''冻结进程收讯挂起位（AM-1.5 内核派生位——SuspendToken 的 wait 面唯一可
命中位）：目标进程冻结期间任一 send 成功入队即置位（一次语义防风暴，同窗
多跳不重复通知），全解冻（最后一枚 token close）清零；所有在册 token 同刻
同视（signal_state 直接读目标 Process.wake_pending 派生，零 per-token 存储）。
消费形：object_wait_one(token, SIGNAL_WAKE_PENDING, deadline, &observed)——
deadline=0 即 poll 探针；零新 syscall。'''
[[signal]]
name = "USER_MASK"
expr = "0xFFFF_FFFF_0000_0000"
desc = '''用户信号位掩码（Event `object_signal` 只收高 32 位用户位；低 32 位保留给
内核派生信号 READABLE/WRITABLE/TERMINATED/WAKE_PENDING——位面冲突由内核
执法拒绝）。'''

# ---- AM-2b 内核占用用户位注记（2026-11-08 提案候选①·主会话六裁决③；
# 纯注记：不产任何常量、不改上表位值/既有行（gen_abi.py 不读注释）。登记
# 面 = 高 32 位用户位中「内核长期写者」的防撞单源——挑新位前与本注记 +
# kernel/src/main.rs `USER_SIGNAL_BITS`（在册位清单）一并核对。位空间按
# 对象隔离：同位异对象无清位/唤醒纠缠，登记语义 = 内核写者在席公示、
# 非全局排他。----
# 1<<40（系统压力 Event·AM-2b partial 跨阈）：dpg 等页停顿窗口
#  （70ms，boot 按 CNTFRQ 换算周期数）Σcyc/W ≥ θ_p（初值 10%【推，实测
#   定标】）时内核任务语境置位 + SQ 窗唤醒（rx_irq_notify 形）；handle
#   经 svcmgr 表第 8 插（0x0001_0008）随 gift 链交 am。消费 = 边沿协议：
#   am 持 SIGNAL 右 object_signal 自清位，以窗口长为 deadline 再等——
#   超时无再置位即恢复（内核不报恢复沿）。
# 1<<41（系统压力 Event·AM-2b complete 跨阈）：**预留位——登记不置位**
#   （PSI full 等价判据需 waiter 深度跟踪，实测定标后启；700ms 窗同式
#   boot 换算）。本刀无任何置位点。

# ---- 错误码（posix-ish 负数；c_note = 文档 §8.2 C 行注）----
# rust = false ⇒ 只产文档 C 行、不产 Rust 常量（保留位/未实现面）。
# TIMEDOUT 的 C 行名自 TIMED_OUT 修正（单源化收口的既有漂移，2026-10）。

[[errno]]
name = "OK"
expr = "0"
rust = false
c_note = ""
[[errno]]
name = "BAD_HANDLE"
expr = "-9"
c_note = "EBADF 等价：坏 handle / 类型不符"
desc = "EBADF：坏 handle / 类型不符 / 代号过期。"
[[errno]]
name = "DEAD"
expr = "-52"
rust = false
c_note = "代号作废：对象/服务已死（旧代 handle），决策 #28"
desc = "代号作废：对象/服务已死（旧代 handle，v3 DEAD 检测启用）。"
[[errno]]
name = "INVALID_ARG"
expr = "-22"
c_note = "EINVAL"
desc = "EINVAL：参数非法（如 replace 两值相同）。"
[[errno]]
name = "E2BIG"
expr = "-7"
c_note = "E2BIG：sched_attr size 超界且尾部非零"
desc = "E2BIG：调度属性长度超界（size > 内核结构且尾部非零；1.1/S1）。"
[[errno]]
name = "NO_MEMORY"
expr = "-12"
c_note = "ENOMEM"
desc = "ENOMEM：无空间（表满 / gen 耗尽 / 超尺寸）。"
[[errno]]
name = "ACCESS_DENIED"
expr = "-13"
c_note = "EACCES：权限位不足"
desc = "EACCES：权限位不足（能力拒绝）。"
[[errno]]
name = "NOT_FOUND"
expr = "-2"
c_note = "ENOENT"
desc = "ENOENT：区间不存在（unmap/protect 找不到精确匹配）。"
[[errno]]
name = "BAD_STATE"
expr = "-37"
c_note = "对象状态不对（未 start / 已关）"
desc = "EBADSTATE：对象状态不满足（读/映射未提交页——eager VMO 面；demand 页 G4-1 起缺页供给）。"
[[errno]]
name = "TIMEDOUT"
expr = "-110"
c_note = "ETIMEDOUT"
desc = "ETIMEDOUT：阻塞等待到点未命中（object_wait_one deadline 到期——4-1）。"
[[errno]]
name = "BUSY"
expr = "-16"
c_note = "EBUSY：channel 满 / 资源占用"
desc = "EBUSY：资源占用（映射未解除的 VMO 不能 close/decommit——悬空 PTE 防线）。"
[[errno]]
name = "AGAIN"
expr = "-11"
c_note = "EAGAIN：非阻塞操作当下无货（channel_recv 空队，3-4b）"
desc = "EAGAIN：非阻塞操作当下无货可取（channel recv 空——3-4b；posix-ish）。"
[[errno]]
name = "NOT_SUPPORTED"
expr = "-95"
c_note = "ENOTSUP：阶段未实现"
desc = "ENOTSUP：未知/未实现编号或能力（ABI §8.4「永不 panic」统一错误面）。"
[[errno]]
name = "OUT_OF_RANGE"
expr = "-34"
c_note = "ERANGE：offset/len 越界"
desc = "EOVERFLOW-style：offset/len 越出对象容量或区间管辖界。"
[[errno]]
name = "FAULT"
expr = "-14"
c_note = "EFAULT：用户指针界检失败（3-2 起 copy_from/to_user 执法）"
desc = "EFAULT：用户缓冲不可访问（未映射/只读页要写/越出用户区）——3-2 copy 路径。"

# ---- §4 编号表（全 57 行：v1 37 + 1.1 4 + v2 11 + v3 5；title 含 **粗体** 原样）----
# implemented = false ⇒ 在册未实现（内核回落 -ENOTSUP；berry-sys 侧常量照发、
# 无 wrapper——生成器对无消费者常量豁免 dead_code，wrapper 随 §8.3 原型层 v2 挂账）。

[[group]]
title = "**handle / 通用对象**"
[[group.syscall]]
num = 0x01
name = "handle_close"
desc = '关闭 handle'
stage = "v1"
[[group.syscall]]
num = 0x02
name = "handle_duplicate"
desc = '复制（权限 ⊆ 原）'
stage = "v1"
[[group.syscall]]
num = 0x03
name = "handle_replace"
desc = '原子替换 handle 槽'
stage = "v1"
[[group.syscall]]
num = 0x04
name = "object_wait_one"
desc = '等单个对象上的信号'
stage = "v1"
note = '4-1 阻塞化（poll-first + 醒来重验 + -ETIMEDOUT）；4-2 扩 Event|Channel。'
[[group.syscall]]
num = 0x05
name = "object_wait_many"
desc = '等多个对象'
stage = "v1"
note = '4-2b 落地：任一命中 → *idx + *observed；WAIT_ANY 哨兵睡眠。'
[[group.syscall]]
num = 0x06
name = "object_signal"
desc = '泛型置/清信号（Event/Interrupt/Job）'
stage = "v1"
note = '3-4c 落地：v1 仅 Event 可 signal（thread/process 信号面随后续步）。'
[[group.syscall]]
num = 0x07
name = "object_get_info"
desc = '查询对象信息（topic 分派）'
stage = "v2"

[[group]]
title = "**内存 / VMO / Vmar**"
[[group.syscall]]
num = 0x11
name = "vmo_create"
desc = '建内存对象'
stage = "v1"
[[group.syscall]]
num = 0x12
name = "vmo_commit"
desc = '提交物理页（eager VMO 面直接分配；demand VMO 供给链自 commit——G4-1 起）'
stage = "v1"
[[group.syscall]]
num = 0x13
name = "vmo_decommit"
desc = '归还页'
stage = "v1"
[[group.syscall]]
num = 0x14
name = "vmo_read"
desc = '内核中介读（非映射访问）'
stage = "v1"
[[group.syscall]]
num = 0x15
name = "vmo_write"
desc = '内核中介写'
stage = "v1"
[[group.syscall]]
num = 0x16
name = "vmar_map"
desc = 'VMO 映射进区间'
stage = "v1"
[[group.syscall]]
num = 0x17
name = "vmar_unmap"
desc = '解除映射'
stage = "v1"
[[group.syscall]]
num = 0x18
name = "vmar_protect"
desc = '改权限'
stage = "v1"
[[group.syscall]]
num = 0x19
name = "vmar_allocate"
desc = '建子区间'
stage = "v1"
[[group.syscall]]
num = 0x1A
name = "vmo_get_size"
desc = '查容量（出参 `*size`，**页对齐**——create 即取整非 blob 实长；门控仅类型不查权利位 need=0，同 wait「等待不需权利」；G-eco svcmgr 消费 rootfs 需要 cpio 总长）'
stage = "v1"
note = 'G-eco（svcmgr 消费 rootfs 需要 cpio 总长；通用元数据查询不止 initrd 受益）。'

[[group.syscall]]
num = 0x1B
name = "vmo_get_phys"
desc = '查字节物理地址（出参 `*pa` = 所在页后备 PA + 页内偏移；匿名 VMO 该页须已 commit，MMIO 窗口 = pa_base+offset；门控仅类型 need=0，同 get_size 几何惯例；PA 是 u64 出参 8 字节宽）'
stage = "v1"
note = 'P6 A-3（用户态 DMA 面：virtqueue 描述符地址是 guest PA，驱动须能查自己 VMO 页的后备；无 IOMMU 板上 PA 披露面 = 已授 MMIO 窗口的设备本可 DMA 全内存，v1 接受并文档化——IOMMU/SMMU 随 `安全与硬件隔离设计-v1.0.md`）。'

[[group]]
title = "**pager**"
[[group.syscall]]
num = 0x21
name = "pager_supply_pages"
desc = '用户态 pager 给 demand VMO 供给一页：入参 vmo（目标，须持 RIGHT_SET_POLICY）+ src（源 VMO 句柄，0 = 填零页）+ src_off（源内页偏移）'
stage = "v1"
note = '''G4-2 首形（§5-③ 裁决）＝阻塞收货：无武装缺页请求时 poll-first 后睡 pager
裸键，fault 探针武装 EL0 请求槽 + 唤醒即递送——ADR #9 缺页路径零分配。供给 =
pt_lock 窗 commit + 填叶 + tlbi/broadcast（vmar_map 同款）+ 唤 faulter。
源数据 VMO 页须 pre-commit（§2.2 防线 4）。pager 崩溃语义 = faulter 永久阻塞
（§5-⑤ 裁决）。'''
[[group.syscall]]
num = 0x22
name = "pager_op_range"
desc = '脏页/换出通知'
stage = "v3"
[[group.syscall]]
num = 0x23
name = "pager_supply_mapped"
desc = '用户态 pager 给 demand VMO 供给一页（delta 恒等选源）：入参 vmo（目标，须持 RIGHT_SET_POLICY）+ src（源 VMO 句柄，0 = 填零页）+ delta（源页偏移 = demand 页偏移 + delta，congruent ELF 段装载形）'
stage = "v1"
note = '''X-3（exec 装载 demand 化）供给面：0x21 收货前钉死 src_off 单偏移，真 ELF
多段装载需按请求页选源页——源偏 = demand 页偏 + 常量 delta（门 C 裁 A 形
2026-11-07：新号 add-only 破冻，先例 0x86/0x87；0x21 原义零漂移）。收货/
唤醒/供给路径与 0x21 同形（阻塞收货 + poll-first 睡 pager 裸键）；源数据
VMO 页须 pre-commit（§2.2 防线 4）。'''
[[group.syscall]]
num = 0x24
name = "pager_supply_mapped_table"
desc = '用户态 pager 批供：入参 tbl（PagerWindow{dv:u32, sv:u32, delta:i64} 16B/项 repr(C) 数组）+ n（∈[1,32]）——多窗一次收货，rc = count-wins：>0 = 供给成功页数（部分成功部分计、不回滚），0 供才报 errno'
stage = "v1"
note = '''X-6 刀①（批供提速）表批形，冻结裁决 2026-11-08（设计稿
`X6批供提速设计-v1.0.md` §7 主裁③「全套照提案冻」）：号 0x24 / N=32
三源镜像（EREQ_SLOTS / PAGER_SLOTS / 表帽）/ count-in-x0 / PagerWindow
布局一次定全即冻。每窗门控/供给/唤醒链与 0x23 同构（阻塞收货 +
poll-first 睡 pager 裸键）；整批 ≤32 页一 KL 窗；池空且已供>0 → 即返
计数不阻塞，池空且 0 供 → 泊键阻塞醒后重扫表。boot 探测回退：
0x24(dv:0,n:1) 新核 -EBADF / 旧核 -ENOTSUP。'''

[[group]]
title = "**进程 / 线程**"
[[group.syscall]]
num = 0x31
name = "process_create"
desc = '建进程 + 出 root Vmar（双出参；job v1 恒 0）'
stage = "v1"
[[group.syscall]]
num = 0x32
name = "process_start"
desc = '启动首线程（entry/sp；bootstrap = 迁入子进程表的首能力 handle，子入口 x0 收到子表新值）'
stage = "v1"
[[group.syscall]]
num = 0x33
name = "process_exit"
desc = '退出'
stage = "v1"
note = 'Plan B v0.5 落地：真退出（不返——`exit_current_with` 经退出钩子 drain+回收）。'
[[group.syscall]]
num = 0x34
name = "thread_create"
desc = '建线程（未启动，入口随 process_start）'
stage = "v1"
[[group.syscall]]
num = 0x35
name = "thread_start"
desc = '投入运行（非首线程——首线程随 process_start；T-1 扩参 entry/sp/arg，Zircon zx_thread_start 同形）'
stage = "v1"
note = 'T-1 落地：门控 Thread MANAGE；所属 Process 须已 start 且 Alive（否则 -EBADSTATE）；线程入口不得返回（返回 = fault 杀兜底）——pthread/线程库的内核地基。'
[[group.syscall]]
num = 0x36
name = "thread_exit"
desc = '线程退出'
stage = "v1"
note = 'Plan B v0.5 落地：v1 单线程 ⇒ 等价 process_exit(0)（Zircon last-thread 语义）。'
[[group.syscall]]
num = 0x37
name = "thread_sleep"
desc = '睡到 deadline（nanosleep 等价）'
stage = "v1"
[[group.syscall]]
num = 0x38
name = "thread_set_priority"
desc = '设优先级（受 SET_POLICY）。**intent 设置复用此号扩参或 add-only 新号，P3 草案 v0 定（ADR #42）**'
stage = "v2"
[[group.syscall]]
num = 0x39
name = "thread_set_deadline"
desc = '设截止期（软实时）'
stage = "v2"
[[group.syscall]]
num = 0x3A
name = "process_get_exit_code"
desc = '查进程退出码（`*code` = i32 出参；未退 → -EAGAIN，poll 语义——先 wait TERMINATED 再查）'
stage = "v1"
note = 'P5 shell v0 收官（`&&` 的真退出码源）：**ABI 单源管线首次真实扩号**。门控仅类型不查权利位（need=0，同 vmo_get_size「对象几何非内容」惯例）。'
[[group.syscall]]
num = 0x3B
name = "process_terminate"
desc = '外部终止进程：`code` 落为该进程退出码；目标走与自退出同一收口（TERMINATED 唤醒 / 子表 drain / 任务摘队入 REAPQ），不开第二退出面。门控 Process **MANAGE**；自杀 → -EBADSTATE（退自己走 process_exit）；已退 → -EBADSTATE。'
stage = "v1"
note = 'C-4b（Ctrl-C/kill 面）落地：VM 草案 R5 预批的唯一扩号。bsh Ctrl-C 杀前台子进程、`kill <pid>` 的内核原语；未 start 的进程可终止（收口免任务面）。'

[[group]]
title = "**调度 1.1（S0–S3 ABI）**"
