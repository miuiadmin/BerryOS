# rootfs-manifest.toml —— BerryOS rootfs 条目映射（平台基座自描述）
#
# V13 预埋刀（ADR #82「组装不 fork」；13 号 §5.1-V13 载体、08 号 §3.2
# 改造清单行 1 的过渡形态）：justfile build-user 里 mkcpio 的 58 条硬编
# name=path 映射外化为数据文件——justfile 是活文件、映射数有保质期
# （08 号采集 47 条 → 13 号实测 58 条，§5.3-③），单源化后加 bin 只改本表。
#
# 语义契约：
#   - 条目行 = mkcpio 调用参数 `name=path` 原样（name 归档内路径、path
#     本地 ELF/包文件——mkcpio 头注）；**path 相对 user/ 目录**（与
#     justfile build-user 现役调用同口径——本表在 user/ CWD 下被消费，
#     挪用方自行解析相对基准）。
#   - 排序/确定性归 mkcpio CLI（整条 name=path 排序——同输入同字节）；
#     本表文件序仅为对读 justfile 旧块的 diff 友好，无语义。
#   - `--split 32`（A1-3b 在册单卷帽）与出档路径 rootfs.cpio 留在配方
#     ——本表只管条目映射（任务书最小侵入面）。
#   - schema：version = 1（u32，add-only——V12 schema=1 同先例）；未知
#     顶层键/坏条目名/坏路径 mkcpio --manifest 一律 loud 拒（berry-manifest
#     未知键硬拒同纪律）。
#   - 与 berry-assemble（V13）的分轨：本表 = 平台基座条目（上游资产自
#     描述）；产品 preset/替换交换（product.services.replace）随 #83
#     清单键定形另立——本表不预坐键位。
#
# 消费面：`python3 tools/mkcpio.py <out.cpio> --manifest tools/rootfs-manifest.toml
#         [--split N]`（justfile build-user mkcpio 步换读本表，其余配方零动）。

version = 1

# P3 装载期数据面（案 a，2026-11-11）：`app/*.bap` 条目的伴生 `*.bap.sig`
# **不在本表登记**——mkcpio `sig_companions` 按同名+.sig 直映射自动收编
# （sign-user 产 .bap.sig 与 .bap 共置 userbins/；缺席零漂移=未签名默认
# 构建逐字节同旧链；裁决记录全文 = tools/mkcpio.py 同名节注）。加 app
# 仍只加一行 .bap——伴生随签名链自动跟车，无第二映射表。

[entries]
"app/APPDEMO.bap" = "userbins/app/APPDEMO.bap"
"app/APPQUIET.bap" = "userbins/app/APPQUIET.bap"
"app/BROWSER.bap" = "userbins/app/BROWSER.bap"
"app/CAMERA.bap" = "userbins/app/CAMERA.bap"
"app/CONTACTS.bap" = "userbins/app/CONTACTS.bap"
"app/MMS.bap" = "userbins/app/MMS.bap"
"app/FILES.bap" = "userbins/app/FILES.bap"
"app/PHOTOS.bap" = "userbins/app/PHOTOS.bap"
"app/SETTINGS.bap" = "userbins/app/SETTINGS.bap"
"bin/bench1" = "cargo-target/aarch64-unknown-linux-musl/release/bench1"
"bin/berry-launcher" = "cargo-target/aarch64-unknown-linux-musl/release/berry-launcher"
# CP-08 装配件（04 号复核 §6-5/§6-6）：PM 双服务 bin——berry-power（电源
# 中枢：频率帽聚合/充电限流票仲裁/util EWMA/pwproto 会话纯核在 lib +
# bin 自检壳 park 常驻）与 berry-thermal（热治理仲裁引擎 + 自检/park
# 壳）。**svcmgr 预拉 arm 已落**（CP-08 闭合：svcmgr 源 PM（spawn 段行号随刀漂移；POLICY4 刀后 berry-power 每 boot 真提交一条四动作条目+policy4 诊断行，非纯 park 零行为；stdin_feed 装配 gift[2] 自描述对过 MANAGE 门）——系统审计 S4 2026-11-17 随刀
# 双服务预拉起——D3 帽 128→160KiB + pager 钉位 0x1E000→0x28000 扩容刀让
# 出的 .bss 面；拉起即 park 常驻，不写任何帽/票/发布位 = 零行为变化）；
# 通道端点 gift 与 ps 账本面随分端执法刀留窗。musl 链 = build-user PM 段
# （berry-ld + --features wired——bin 的 berry-libc shim 门）。
"bin/berry-power" = "cargo-target/aarch64-unknown-linux-musl/release/berry-power"
"bin/berry-thermal" = "cargo-target/aarch64-unknown-linux-musl/release/berry-thermal"
# P3 案 c：装载期验签助手（none target rootfs ELF——hello 同链；svcmgr
# p3_sig_guard spawn 消费；伴生 .sig 在档才起守卫，缺席零扰动）。
