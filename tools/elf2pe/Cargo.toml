[package]
name = "elf2pe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "BerryOS 静态 ELF（AArch64）→ PE32+ EFI 应用转换器（BerryBoot 产线，彻底 Rust 化轨道 b 层 #8）"

[lib]
name = "elf2pe"
path = "src/lib.rs"

[[bin]]
name = "elf2pe"
path = "src/main.rs"

# 零依赖纪律（W1 lane：禁新外部依赖）——纯 std，与 tools/elf2flat 同款独立
# 小工作区形态（根 .cargo/config.toml 锁 build.target=aarch64-unknown-none，
# 宿主件靠 --manifest-path + 显式 --target 走 host 面）。
[dependencies]

# 独立小工作区标记（tools/elf2flat 同款形态——根 workspace 自动上溯在此截断）
[workspace]
