[package]
name = "berryassemble"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "BerryOS 产品配置层组装器（berry_assemble.py Rust 首刀，彻底 Rust 化轨道 b 层 #6 刀序第六位——boot-params 词表执法+序列化 / kernel 锚形 / 装配反回滚门 / platform level 单源读器）"

[lib]
name = "berryassemble"
path = "src/lib.rs"

# 三刀·CLI 消费半边（--check-lite 臂——gensourceindex main.rs 同款形态）。
[[bin]]
name = "berryassemble"
path = "src/main.rs"

# 零外部依赖纪律（W1 lane：禁新外部依赖）——纯 std。与 tools/elf2flat、
# tools/mkcpio、tools/mkfat、tools/mkimage、tools/mkapp、tools/gensourceindex
# 同款独立小工作区形态（根 .cargo/config.toml 锁 build.target=
# aarch64-unknown-none，宿主件靠 --manifest-path + 显式 --target 走 host 面）。
[dependencies]

# 独立小工作区标记（tools/mkfat 同款形态——根 workspace 自动上溯在此截断）
[workspace]
