[package]
name = "berry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BerryOS developer device shell (host tool)"
publish = false

[lib]
name = "berry"
path = "src/lib.rs"

[[bin]]
name = "berry"
path = "src/main.rs"

[features]
gui = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
softbuffer = "0.4"
miniz_oxide = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
