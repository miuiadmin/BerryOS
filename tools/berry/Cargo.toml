[package]
name = "berry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BerryOS developer device shell (host tool)"
publish = false

[lib]
name = "berry"
path = "src/lib.rs"

[[bin]]
name = "berry"
path = "src/main.rs"

[features]
gui = []

[dependencies]
berry-cbox = { path = "../../user/berry-cbox" }
berry-dmface = { path = "../../dmface" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
softbuffer = "0.4"
miniz_oxide = "0.8"
# VNC wave 5 TLS plane (VeNCrypt client / https page / wss termination).
# Host tool only (this workspace never enters the guest image). Minimal
# feature set per plan: ring backend, std, tls12; no aws-lc-rs, no logging.
# rustls-pki-types is a direct dep because PEM loading + ServerName types
# sit on the public path of this knife, not just transitively.
# Licenses: rustls Apache-2.0 OR ISC OR MIT; ring Apache-2.0 AND ISC;
# pki-types/webpki/once_cell/zeroize/cfg-if/getrandom/libc ISC or MIT or
# Apache-2.0; sole exception subtle 2.6.1 = BSD-3-Clause (three-clause,
# accepted by the wave-5 plan; no removal path from rustls 0.23).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# VNC wave 10 terminal QR (Nayuki qrcodegen): single-file pure-Rust MIT
# crate, zero transitive dependencies (Cargo.lock gains exactly one line),
# no rust-version/edition declaration so MSRV risk is nil. Used only by
# `berry vnc web --lan` pairing (host tool, never enters the guest).
qrcodegen = "1.8"
# 显示加速 B1-b 壳半（#286）：wgpu Metal 呈现骨架 + overlay alpha 合成。
# Host 工具面（不进客机镜像）。wgpu 30 系依赖树经 lock 收敛（见 Cargo.lock）。
wgpu = "30.0"
pollster = "1.0.1"
bytemuck = "1.25.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
