# berry-crypto —— SDK-2 分发签名链 crate（P0-2：原语+信封+账本+向量门）。
# 设计 = docs/SDK-2-分发与签名链设计-v1.2.md §二/§三 + research/厂商定制化
# 深研/24 号 §3；选型终裁 = 26 号 §3（自研 ed25519 优先——保 user/ workspace
# 零外部依赖纪律，31 crate 先例）。「解析器即产品」家族形态：零分配/零
# unsafe/零依赖/输入只借用；cfg_attr(not(test), no_std)。
# **P0-2 完整面**（P0-1 信封/账本 + 姊妹刀合流）：ed25519/SHA-512 自研
# 原语（fe/ge/sc/sha512/ed25519）+ RFC 8032 §7.1 官方向量门（verify+sign
# 双向）+ Wycheproof ed25519 210 条 strict 门（小阶/混阶公钥拒收——
# torsion 检查执法面，29 号 §F1；mixed-order 门不过不合入，26 号 §3-2/§3-3）。
# **P0 合入 = 闸 B 触发 = Q6 账本 schema 重议窗关闭**（24 号 §4.2 终核
# 三条随 26 号 §3-4 开工令强制引用）。信封格式 Q3 未冻结（P3 前最后重议）。
# **P1 签名集成刀**（24 号 §4.3）：SHA-512/256 截断变体（sha512.rs，
# alg_id=1 摘要面）+ host CLI `berry-sign`（keygen/sign/verify/selftest，
# 消费 tools/mkapp.py --sign-key/--verify-key）。
[package]
name = "berry-crypto"
version = "0.1.0"
edition = "2021"
description = "BerryOS SDK-2 signing chain (P0-2): self-hosted ed25519+SHA-512 primitives + .sig envelope TLV v1 + trust ledger TOML + RFC 8032 & Wycheproof vector gates (strict)"
license = "Apache-2.0"

# bin 独立 crate root（std 面，host target aarch64-apple-darwin）；lib 保持
# no_std「解析器即产品」形态——bin 用 std 不回头污染 lib 面。
[[bin]]
name = "berry-sign"
path = "src/main.rs"

[dependencies]
# 24 号 §3.3-1 单解释器纪律方案 A：manifest 关键域摘要输入必须由
# berry-manifest 解析产物单源派生（禁止本 crate 内出现第二个 manifest
# 语义判断）。berry-manifest 同为 no_std+零依赖 crate（svcmgr none target
# 同款消费），none target 构建链不受影响；零**外部**（crates.io）依赖
# 纪律不破。消费面 = berry-sign（bin）；lib 模块面暂不 import。
berry-manifest = { path = "../berry-manifest" }
