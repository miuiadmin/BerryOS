[package]
name = "berry-pwproto"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"   # MSRV = musl 1.2.5 口径基线（Rust 2025-12 起 musl 目标；SDK-02 拍板①）
# sim-S1（docs/sim设备通道与契约设计-v1.0.md；PM-16 §4.1 契约、PM-17 §3.2
# sim-S1 行）：sim 三设备（电池/热/modem）快照协议纯函数 crate，
# `berry-netdproto`/`berry-psproto` 先例（「解析器即产品」）——
# `cfg_attr(not(test), no_std)`：库本体 no_std（用户态 workspace 成员在
# aarch64-unknown-none 下构建），test 构建放开 std 仅为默认测试挂具。
# 双消费（绿传递律单源落点，PM-16 §4.1）：simbattery 服务（本仓首消费，
# UART1 字节流）+ 未来真机电池/热/modem 驱动 + berry-sys 只读面（L3 SDK
# 契约刀）——三处消费同一 crate，仿真专用分支禁止进主线。
description = "BerryOS sim-device snapshot wire protocol: pure no_std encoder/parser (battery/thermal/modem + ACK + stream decoder)"
license = "Apache-2.0"
repository = "https://github.com/miuiadmin/BerryOS"
keywords = ["berryos", "protocol", "battery", "snapshot", "no-std"]
categories = ["no-std", "embedded"]

[dependencies]
