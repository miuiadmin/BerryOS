[package]
name = "berry-tls"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"   # MSRV = musl 1.2.5 口径基线（Rust 2025-12 起 musl 目标；SDK-02 拍板①）
# T-1 §1（docs/T-1实施设计草案.md 裁决三）：TLS 拷贝式放置纯函数 crate
# ——tls_place/find_ptls/模板四全局。`berry-psproto` 同款 `cfg_attr(
# not(test), no_std)`：库本体 no_std（berry-libc crt0 在 none/musl 双
# target 下消费），test 构建放开 std 仅为默认测试挂具。
#
# 为什么独立 crate（§6 回退启用，berry-fsclient 先例）：berry-libc 定义
# ~百枚 libc 同名符号，host 测试二进制里对 libSystem 的 write 发生符号
# 插入（interpose）——首跑实测 panic 钩子 stderr 输出被劫进 berry-libc
# write → console_write → berry_channel_send 自旋（99% CPU 挂死，sample
# 栈实证）。纯面独立零依赖 crate 后 host 测试不链任何 libc 符号面。
description = "BerryOS copy-style TLS placement pure functions (tls_place/find_ptls/template globals)"
license = "Apache-2.0"
repository = "https://github.com/miuiadmin/BerryOS"
readme = "README.md"
keywords = ["berryos", "tls", "thread-local-storage", "elf", "no-std"]
categories = ["memory-management", "no-std"]

[dependencies]
