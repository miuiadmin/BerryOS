[package]
name = "berry-spawngeo"
version = "0.1.0"
edition = "2021"

# spawn 几何前置门纯函数 crate：`spawn_geometry`（ELF 映幅帽 ELF_MAP_MAX /
# 栈顶 USER_TOP 前置 / MMIO 窗口重叠前置三段）自 berry-exec 外迁——原处
# 内嵌于 spawn_rootfs_elf（berry-sys 的 aarch64 svc #0 asm 令 berry-exec
# 在 host 结构性不可编译，几何前置面因此零测试）。
# 外迁 = berry-argv/berry-winplan 同款「纯面外迁」纪律（berry-tls/mmap/
# signal 自 berry-libc 外迁的先例族）：零 FFI 零 unsafe 零分配，拒绝原因
# 枚举化（原处三段共用 return Err(()) 不可分辨）。
# 消费：berry-exec（spawn_rootfs_elf process_create 前置段）经 path 依赖
# 单源引回，「不长第二套」；host 测试经 justfile test-host 显式行跑。
license = "Apache-2.0"

[dependencies]
# 只借 PAGE_SIZE/USER_TOP（纯常量面，loader 本身 host 可测；winplan 同款
# 依赖先例——类型与常量单源，勿在本 crate 复制数值）。
berry-loader = { path = "../berry-loader" }
