[package]
name = "berry-winplan"
version = "0.1.0"
edition = "2021"

# X-5 demand 装载窗规划纯函数 crate：`demand_plan_wins`（三色窗几何 +
# congruent 门 (a')-(e')）自 berry-exec 外迁——原处内嵌一次
# `berry_vmo_get_size` FFI（berry-sys 的 aarch64 `svc #0` asm 令整个
# berry-exec 在 host 结构性不可编译、零 host 测试——X-3c 侦察结论）。
# 外迁 = cap 参数化，纯面零 FFI 零 unsafe 零分配（berry-tls/mmap/signal
# 自 berry-libc 外迁的同款「纯面外迁」纪律，Cargo.toml 注释先例在案）。
# 消费：berry-exec（spawn_rootfs_elf 的 demand 分支）经 path 依赖单源
# 引回，「不长第二套」；host 测试经 justfile test-host 显式行跑。
license = "Apache-2.0"

[dependencies]
# 只借 SegHead/ElfHead 类型与 PAGE_SIZE（纯类型面，loader 本身 host 可测）。
berry-loader = { path = "../berry-loader" }
