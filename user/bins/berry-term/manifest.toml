[app]
id = "TERMINAL"
version = "0.1.0"
entry = "bin/berry-term"
type = "app"
intent = "utility"

[capabilities]
console = false
fs = ["rootfs"]

[runtime]
stack_pages = 64

[security]
profile = "ed25519-main"
key_lineage = "berryos-dev"
integrator = "berryos"

[ui]
icon = "icons/icon.byi"
label = "Terminal"
views = "views/main.bui"
