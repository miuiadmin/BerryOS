[package]
name = "berry-term"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 同批同值——settings/files/appstub 同款）。
# 升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# GUI 终端应用（TERMINAL）——settings/files 同链第三件真 GUI app：黑底
# 定容行环（24 行 × 64B）+ 行编辑器 + 持久子 bsh（stdin_handle 通道模型
# ——键盘行经 GUI 输入面抵达，Enter 整行发通道；stdout 私有对端回流进
# 行环）。链与形态 = settings 镜像（musl std + berry-libc shim + CRT0
# 链接种子 + berry-ld 链，构建行见 justfile build-user 的 RUSTFLAGS 形）；
# wm 门控走 wm_present_h()（fs+ui 礼物布局——files 先例，wm_cli_h 的
# GIFT_H[0] 位对 wants_fs 程序承载 rootfs VMO，不可用）。
#
# 与 settings 五件差异：+ berry-exec（spawn_rootfs_elf/cpio_find/
# channel_pair——子 bsh 拉起与管道面，bsh/guifbd/svcmgr 同依赖）。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-libc = { path = "../../berry-libc" }
berry-sys = { path = "../../berry-sys" }
berry-exec = { path = "../../berry-exec" }
berry-guiproto = { path = "../../berry-guiproto" }
berry-ui = { path = "../../berry-ui" }
berry-gfx = { path = "../../berry-gfx" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
