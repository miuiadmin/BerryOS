[package]
name = "mms-app"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 23 件同批同值）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

# 波4 批3（六波方案步骤 5）：FILES 官方应用真 UI——settings-app 同型
# 独立小工作区（musl target + berry-libc shim + CRT0_SEED 锚）。appstub
# 静默壳换真 UI：manifest 面零改动（entry=bin/files 不变），构建面在
# justfile build-user 的 app-stage 段替换 cp 源。
[workspace]

[dependencies]
berry-libc = { path = "../../berry-libc" }
berry-sys = { path = "../../berry-sys" }
berry-gfx = { path = "../../berry-gfx" }
berry-guiproto = { path = "../../berry-guiproto" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
