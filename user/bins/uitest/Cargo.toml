[package]
name = "uitest"
version = "0.1.0"
edition = "2021"
# GUI F5 系统验收 app：只消费 berry-room + berry-ui SDK；WM/VMO/像素
# 归 Berry Room，组件与状态归 BerryUI，不解析 .bui。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-gfx = { path = "../../berry-gfx" }
berry-room = { path = "../../berry-room" }
berry-ui = { path = "../../berry-ui", features = ["guest-font-vmo"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
