[package]
name = "berryctl"
version = "0.1.0"
edition = "2021"

# C-3 段②（docs/VM里程碑设计草案.md §C-3）：berryctl v0 雏形——
# ver/ps/mem 三子命令 → psproto 三 op（OP_VER/OP_PS_LIST/OP_MEM）。
# musl std 独立小工作区（ps/stdhello 同链），deps = berry-libc（gift2_h
# 读 env 块 gift[2] = svcmgr 预建查询端 ps_b）+ berry-sys（channel/wait/
# clock 直调）+ berry-psproto（协议）。严格串行 RPC；渲染经私有 stdout
# 收集（svcmgr bc_selftest 断言打 `BC ok`）。bsh `run` 拉起档无 ps_b
# gift → 「no svcmgr gift」诊断退 1（v0 雏形边界——服务发现留 v2）。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-libc = { path = "../../berry-libc" }
berry-sys = { path = "../../berry-sys" }
berry-psproto = { path = "../../berry-psproto" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
