[app]
id = "APPDEMO"
version = "0.1.0"
entry = "bin/appdemo"
type = "app"
intent = "utility"

[compat]
min = "0.1.0"
target = "0.1.0"
compile = "0.1.0"
min_level = 1

[capabilities]
console = true
fs = ["rootfs"]

[runtime]
stack_pages = 64

[security]
profile = "ed25519-main"
key_lineage = "berryos-dev"
integrator = "berryos"

[ui]
icon = "icons/icon.byi"
label = "Gallery"
views = "views/main.bui"
