[package]
name = "appdemo"
version = "0.1.0"
edition = "2021"

# app-0 demo 双 app 之一（`docs/app-0实施设计草案.md` §4）：manifest
# `console = true` + `[fs]` 授权。2026-11-07 真实系统化 Phase 0 改
# no_std + berry-fsclient direct RPC：保留 argv0 / 两行标记 / mtab 23B
# / EOF / exit(0) 五件验收，同时回收 std 链 rootfs 预算。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-fsclient = { path = "../../berry-fsclient" }
berry-sys = { path = "../../berry-sys" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
