[package]
name = "settings"
version = "0.1.0"
edition = "2021"
# GUI F6 迁移 Settings：Berry Room 负责 WM/窗口/frame/输入/销毁，
# BerryUI/Berry Design 负责组件、主题与状态视觉；WLAN/Bluetooth 是本进程
# 内存态真实切换（v1 不接驱动/持久化）。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-gfx = { path = "../../berry-gfx" }
berry-room = { path = "../../berry-room" }
berry-ui = { path = "../../berry-ui", features = ["guest-font-vmo"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
