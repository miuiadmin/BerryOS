[package]
name = "stdhello"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 22 件同批同值）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# 独立小工作区（主工作区 excluded）：musl target + berry-ld RUSTFLAGS 与
# aarch64-unknown-none 全家互不渗漏——std 程序不可能在 none target 下编。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-libc = { path = "../../berry-libc" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# d-1a 验收面：链接残留审计需要符号表（release 剥了就没得看）
[profile.audit]
inherits = "release"
strip = false
