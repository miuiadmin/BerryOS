[package]
name = "files"
version = "0.1.0"
edition = "2021"
# Files Native Shell：独立 no_std GUI 进程。真实 READDIR/STAT/GET 走
# fsmgr RPC；v1 只读文件浏览，不提供写/删/搜索。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-fbcon = { path = "../../berry-fbcon" }
berry-fsclient = { path = "../../berry-fsclient" }
berry-fsproto = { path = "../../berry-fsproto" }
berry-guiproto = { path = "../../berry-guiproto" }
berry-sys = { path = "../../berry-sys" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
