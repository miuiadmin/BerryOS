[app]
id = "FILES"
version = "0.1.0"
entry = "bin/files"
type = "app"
intent = "utility"

[capabilities]
console = true
fs = ["rootfs"]
wm = true

[runtime]
stack_pages = 64

[security]
profile = "ed25519-main"
key_lineage = "berryos-dev"
integrator = "berryos"

[ui]
icon = "icons/icon.byi"
label = "Files"
views = "views/main.bui"
