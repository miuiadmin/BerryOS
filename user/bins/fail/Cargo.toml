[package]
name = "fail"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 22 件同批同值）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# P5 shell v0 收官：`&&` 的确定性非零退出源（stdhello 同链独立小工作区——
# 主工作区 excluded，musl target 与 aarch64-unknown-none 全家互不渗漏）。
# 契约：exit(42) —— libc exit → EOF 先行 + berry_process_exit(0x33, 42)，
# 父侧（bsh）reap 收 42（0x3A 真退出码链的运行期验收面）。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-libc = { path = "../../berry-libc" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
