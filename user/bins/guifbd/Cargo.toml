[package]
name = "guifbd"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 22 件同批同值）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# GUI-1（M-GUI 首刀）：framebuffer 显示服务（V-6 刀 2 后段收口）。fsmgr/
# vblk 同构独立小工作区（musl target + berry-libc shim）。拓扑：内核 boot
# 把 GOP fb 窗包成 MMIO VMO 插 svcmgr 表（第 5 插）+ 几何五域 40B 匿名
# VMO（第 6 插）——svcmgr 预拉段以 `SpawnSpec::mmio_vmo` 把 fb 窗映到
# [`berry_exec::FB_VA`]、info VMO 经 env 块 extras[0] 随行（libc
# `gift2_h()`——rootfs_h 同槽别名惯例）。启动自验三步（clear 双相位差分
# /蜂格字形对拍/scroll 行移对拍）全过才打 `FBW ok`（stdout = console 发
# 端，vblk VBLK ok 同款）；段②起 park 换 serve 循环收 console 转发上屏。
# GUI-2 段③（消费侧首刀）：serve 循环升格三路（present→hdi→console 轮询
# + wait_many n=3 并等，deadline=min(下次软 vsync 点, now+10s) 进调用）；
# present 域六 op 服务端真身（blit-at-SUBMIT + credits≤2 + 两条 ST_BAD
# damage 立法 + 拒面 close 随行 handle）+ hdi 域软 vsync 四 op 退化形；
# console 路恒同步直写 + FULL 纯记账；首个 gfx 帧一次性 `GFXF ok n=`。
# wire 单源 = berry-guiproto（三域 channel + 恰形编解码——本服务零协议
# 改动，ADR #54 接线半边）。
#
# B1-b+c（显示与加速体系 02 号 §3.2/§6，双后端刀）：lib/bin 双面化
# （gui-inputd 先例）——lib = vgpu 后端纯面（后端分派/INDIRECT 链构造/
# ATTACH_BACKING 段切/提交序——host 单测，只依赖 berry-gpuproto +
# berry-virtio 两纯 crate）；bin = guest 入口（真设备链 + syscall 面）。
# berry-libc 按目标门控（`cfg(target_os = "linux")`——musl 侧才在场：
# 其 crt0 汇编在 host 测试二进制不编，libc 同名符号插入劫 libSystem 同
# T-1 实录，gui-inputd 同款）。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-sys = { path = "../../berry-sys" }
berry-exec = { path = "../../berry-exec" }
berry-fbcon = { path = "../../berry-fbcon" }
berry-guiproto = { path = "../../berry-guiproto" }
# B1-b：virtio-gpu 2D 控制队列协议（九命令 encode/parse + BGRX 直配）。
berry-gpuproto = { path = "../../berry-gpuproto" }
# B1-c：virtqueue 传输（RingLayout/publish/used + mmio 表 + INDIRECT 位）。
berry-virtio = { path = "../../../drivers/berry-virtio" }

# guest 面依赖（musl/linux 侧才在场——gui-inputd 同款门控）：crt0/交接
# stdin/park（host `cargo test --lib` 只建 lib 纯面，bin 不连 berry-libc）。
[target.'cfg(target_os = "linux")'.dependencies]
berry-libc = { path = "../../berry-libc" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
