[app]
id = "PHOTOS"
version = "0.1.0"
entry = "bin/photos"
type = "app"
intent = "utility"

[capabilities]
console = true
fs = ["rootfs"]
wm = true

[runtime]
stack_pages = 64

[security]
profile = "ed25519-main"
key_lineage = "berryos-dev"
integrator = "berryos"

[ui]
icon = "icons/icon.byi"
label = "Photos"
views = "views/main.bui"
