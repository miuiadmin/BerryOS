[package]
name = "photos"
version = "0.1.0"
edition = "2021"
# GUI F8 迁移 Photos：真实 PATTERN.BIN READDIR/STAT/GET 与 5000B 校验
# 继续走 berry-fsclient；WM/页面状态视觉归 Berry Room + BerryUI。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-fsclient = { path = "../../berry-fsclient" }
berry-gfx = { path = "../../berry-gfx" }
berry-room = { path = "../../berry-room" }
berry-ui = { path = "../../berry-ui", features = ["guest-font-vmo"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
