[package]
name = "contacts"
version = "0.1.0"
edition = "2021"
# GUI F7 迁移 Contacts：真实 CONTACTS.TXT 数据链继续走 berry-fsclient；
# WM/窗口/frame/输入/销毁归 Berry Room，页面/详情/收藏视觉归 BerryUI。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-fsclient = { path = "../../berry-fsclient" }
berry-gfx = { path = "../../berry-gfx" }
berry-room = { path = "../../berry-room" }
berry-ui = { path = "../../berry-ui", features = ["guest-font-vmo"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
