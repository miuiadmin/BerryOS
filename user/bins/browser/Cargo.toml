[package]
name = "browser"
version = "0.1.0"
edition = "2021"
# GUI F8 迁移 Browser：WM/窗口/frame/输入/销毁归 Berry Room，页面与
# 诚实状态视觉归 BerryUI/Berry Design。v1 无网络、无 HTML 引擎。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-gfx = { path = "../../berry-gfx" }
berry-room = { path = "../../berry-room" }
berry-ui = { path = "../../berry-ui", features = ["guest-font-vmo"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
