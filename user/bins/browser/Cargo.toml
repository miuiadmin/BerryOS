[package]
name = "browser"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 同批同值——settings/appstub/gfxdemo/berry-launcher
# 同款）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# 波 4 第四件（.agents/plans/2026-11-15-波4预制应用翻新实施设计.md §2.7；
# 侦察/对账底册 = worktree 根 W4-RECON.md）：BROWSER 真 GUI 应用——
# appstub 秒退壳替换。页面树 = 书签卡片两列网格（pattern::card + 程序化
# globe glyph 前导图标）→ 页页（app_bar Back + 尾随刷新 glyph + 地址行
# Input/Go-Stop + Progress 模拟加载 + 程序化页体），NavHost push/pop
# 返回书签；历史 v1 单级（页内链接就地换页不叠栈）。
#
# 模式件消费纪律（波 4 铁律）：卡片 = pattern::card 配方，按压反馈色
# 单源 = pattern ItemState 五态预混表（files 批同款 Stack 面层 Rect 叠层
# 习语）；文案全 ASCII；帧循环零分配。
#
# 链与形态 = settings crate 镜像（波 4 首件先例，W4-RECON §1）：独立
# 小工作区（空 [workspace] escape user 根 workspace）+ musl target +
# berry-libc shim + berry-ld 链，构建行照 justfile build-user APPTOMB
# 段 RUSTFLAGS 形。持久化 BOOKS.JSN（上次地址）走 launcher layout_io
# 食谱（fs 词授权 → fs gift；缺席/坏读自愈 + 写失败非致命）。
#
# 与任务书草签 Cargo.toml 的三处偏差（settings 先例在册裁定）：字面
# version 替 workspace 继承 + berry-libc（crt0/wm/fs 访问器）+
# berry-guiproto（wire 编解码——berry-ui 只引类型不 re-export 收发面）。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-libc = { path = "../../berry-libc" }
berry-sys = { path = "../../berry-sys" }
berry-guiproto = { path = "../../berry-guiproto" }
berry-ui = { path = "../../berry-ui" }
berry-gfx = { path = "../../berry-gfx" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
