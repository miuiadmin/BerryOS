[package]
name = "devmgr"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 家族同批同值）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# devmgr v1（驱动子系统研究报告 §4.2 交付 1.1 的最小先行版）：用户态
# 设备管理服务——枚举 + 驱动匹配 + 服务状态报告。devmgr v2（DTB 枚举 →
# 资源池 → 匹配 → 授权 → /svc 注册）的纯观察半边先落：扫 32 槽
# virtio-mmio 窗读 MagicValue/DeviceID 建设备清单，按设备 ID 查驱动
# 匹配表（blk=2→vblk / net=1→vnet / input=18→gui-inputd / gpu=16→
# guifbd），再查 svcmgr 拉起账本（berry-psproto PS_LIST RPC，ps bin 同
# 拓扑）打每设备服务在席状态，缺席者 WARN。**不拉起任何服务**（svcmgr
# 点名拉起链不动，v2 才做自动拉起）。
#
# lib/bin 双面（guifbd 先例）：lib = 枚举/匹配/报告纯面（SlotReader/
# SvcLedger 注入，host `cargo test --lib` 可测，零 syscall 面）；bin =
# guest 入口（MMIO 窗 volatile 读 + psproto RPC）。MMIO 窗契约 = vprobe
# 同款：拉起者经 `SpawnSpec::mmio_vmo` 授窗映到
# `berry_exec::VIRTIO_MMIO_VA`——**本进程不自造物理窗**（EL0 铁律），
# 无窗拉起 = 读窗 D-abort 只死自己。svc 查询通道契约 = ps 同款：env 块
# gift[2]（libc `gift2_h()`）交付 svcmgr 预建端点，缺席 = 状态降级为
# unknown（不致命——枚举报告仍完整输出）。musl std 独立小工作区
# （stdhello/ps 同链）。
license = "Apache-2.0"

[workspace]

[dependencies]
# 协议纯函数 crate（零 syscall 面，host 测试同链）：ps 账本帧编解码。
berry-psproto = { path = "../../berry-psproto" }

# guest 面依赖（musl/linux 侧才在场——guifbd/ps 同款门控）：窗几何常量
# 单源（VIRTIO_MMIO_VA/SLOTS/STRIDE）、channel/wait syscall 面、crt0 锚
# 与 gift2_h（host `cargo test --lib` 只建 lib 纯面，bin 不连这些）。
[target.'cfg(target_os = "linux")'.dependencies]
berry-libc = { path = "../../berry-libc" }
berry-sys = { path = "../../berry-sys" }
berry-exec = { path = "../../berry-exec" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
