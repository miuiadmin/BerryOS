[package]
name = "berry-power"
# L-SYS 0.2.0：字面版本不走 workspace 继承（musl 链独立小工作区，版本治理
# 规则/14；user/bins 件同批同值）。升版 = 逐 crate 手同步。
version = "0.2.0"
edition = "2021"

# 调度彻底计划裁九落件（docs/调度彻底计划-v1.2.md §3 裁九/§4.1 CP-08/
# §4.2 CP-10）：berry-power 电源中枢服务本体骨架——「调度-PM 契约空转」
# 三大接缝之二的服务侧收口（research/调度彻底计划/01-调度现状全景与在途
# 线收编.md §2.4「berry-power 服务本体未建」；立法三件 ADR #66/#67/#68
# 已齐而消费侧缺位）。双面 crate（gui-inputd 先例）：lib = 纯函数核
# （频率帽聚合点/充电限流票仲裁/util EWMA 消费位/pwproto 帧会话机，host
# 单测全盖）；bin = main 循环骨架（常驻/svcmgr 挂接/真实通道全留窗注释，
# 见 src/main.rs 头注窗表）。
#
# 形态：simbattery/berry-launcher 同形独立小工作区（空 [workspace] escape
# 根 workspace，不入 user/Cargo.toml members）。CP-08 装配件（04 号复核
# §6-5）已接线：justfile build-user musl 段（--features wired）+
# rootfs-manifest 条目 + test-host host 测试行；**svcmgr 预拉 arm 留窗**
# ——svcmgr 平像满载（.bss 终点 0x1dff0 距内核钉位 .pager_entry@0x1e000
# 仅 0x10，arm 最小面装不进，链接期 loud 炸响实证；扩容走 kernel 面），
# rootfs 条目零消费零行为变化；通道面（fd0 sim 分端/内核聚合点写面/
# chargerd 票 IPC——04 号 §6-1..4 裁决类）同留窗（src/main.rs 窗表）。
license = "Apache-2.0"

[workspace]

# bin 面（musl/berry-libc 链）host 不可链接（berry-libc 含 aarch64 专属
# asm——bin 自检壳用 println/park 家族原语经 shim）——挂 required-features
# 门（berry-thermal 同款）：host 测试相（无 --features）整跳过 bin，产线
# 构建相（build-user PM 段）开 `--features wired` 落 musl 链；纯核全在
# lib，host 单测盖。
[[bin]]
name = "berry-power"
path = "src/main.rs"
test = false
required-features = ["wired"]

[features]
# wired = bin 壳接上 berry-libc（println/park 家族原语）+ berry-sys（CP-08
# util 通道首环——sched_util_snapshot 0x40 快照读）；host 测试不需要
# （04 号复核 F4「bin 无 berry-libc shim」缺注随前刀收口；berry-sys 同门
# ——host 测试相纯核全在 lib，零 EL0 面零 syscall 依赖）。
wired = ["dep:berry-libc", "dep:berry-sys"]

[dependencies]
# 契约单源：sim 三设备快照协议（帧/ACK/流式解码——ADR #68 ③ SDK 面零新
# syscall 的协议载体，sim-S1 冻结）。
berry-pwproto = { path = "../../berry-pwproto" }
# EWMA 折叠数学单源（α=1/8 移位、0..=1024 尺度、窗常量——sched/src/util.rs
# 生产侧同源消费；本件消费侧零第二实现，W3-Q14 纪律）。
berry-emface = { path = "../../../emface" }
# bin 壳（optional，wired 门）：console 诊断行 + park 常驻原语。
berry-libc = { path = "../../berry-libc", optional = true }
# util 通道首环（optional，wired 门）：sched_util_snapshot 0x40 快照读
# wrapper——内核 per-CPU EWMA → 本服务消费（CP-08 刀③；simbattery 同款
# berry-sys 依赖先例）。
berry-sys = { path = "../../berry-sys", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
