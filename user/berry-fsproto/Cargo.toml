[package]
name = "berry-fsproto"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"   # MSRV = musl 1.2.5 口径基线（Rust 2025-12 起 musl 目标；SDK-02 拍板①）
# P6 A-1（docs/文件系统设计.md §6 / shell设计.md P6 行）：fs 服务 RPC 协议
# 纯函数 crate，`berry-loader` 先例（D5「解析器即产品」）——`cfg_attr(not(test),
# no_std)`：库本体 no_std（用户态 workspace 成员在 aarch64-unknown-none 下
# 构建），test 构建放开 std 仅为默认测试挂具。双消费：fsmgr（服务端）/
# bsh（客户端）经各自独立小工作区 path 依赖。
description = "BerryOS filesystem-service RPC wire protocol: pure no_std encoder/parser (10 ops, host-testable)"
license = "Apache-2.0"
repository = "https://github.com/miuiadmin/BerryOS"
readme = "README.md"
keywords = ["berryos", "filesystem", "rpc", "protocol", "no-std"]
categories = ["filesystem", "no-std"]

