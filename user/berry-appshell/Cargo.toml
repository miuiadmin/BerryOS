# berry-appshell —— BerryOS 应用壳组件 v1（刀 C/波 3 件：Dialog/Menu/Toast）
#
# 六波总纲步骤 4「Dialog/Menu/Toast v1 落 berry-appshell」的最小承载：
# 只做三件 overlay 组件（in-app 形态——真 SYSTEM/SERVICE 层窗随波 3 分支
# 并主后接线，接点注释在源内标注）。依赖收窄 = berry-ui + berry-gfx
# （Color 单源；C-RECON §五裁决：不 cherry-pick wave3 抽取版——彼为
# launcher 五模块骨架且不含本三件；并主时抽取版骨架吸收本 widget 模块，
# 纯增量）。
# 形态照 berry-layout 家族：cfg_attr(not(test), no_std)——lib 按 no_std
# 编（musl/none 消费面皆可挂），test 构建放开 std 跑默认 harness。
[package]
name = "berry-appshell"
version.workspace = true
edition = "2021"
description = "BerryOS app-shell overlay widgets v1: Dialog/Menu/Toast (wave3 fill, in-app form)"
license = "Apache-2.0"

[dependencies]
berry-gfx = { path = "../berry-gfx" }
berry-ui = { path = "../berry-ui" }
