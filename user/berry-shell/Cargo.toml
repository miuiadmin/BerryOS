[package]
name = "berry-shell"
version = "0.1.0"
edition = "2021"
# GUI F1：Native Shell 宿主单一事实源——APP env/WM session/系统字体/窗口
# frame VMO/present/input/destroy 生命周期归此，不绘制业务 UI。
license = "Apache-2.0"

[workspace]

[dependencies]
berry-guiproto = { path = "../berry-guiproto" }
berry-sys = { path = "../berry-sys" }

[features]
default = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
