[package]
name = "berry-kernel"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"

[[bin]]
name = "berry-kernel"
path = "src/main.rs"

[dependencies]
berry-hal-aarch64 = { path = "../arch/aarch64" }
berry-mm = { path = "../mm" }
berry-sched = { path = "../sched" }
berry-vmoledger = { path = "../vmoledger" }
# W3-Q5：PI 纯函数面单源（donor_edge 资格判 + PI_MAX_HOPS 轮帽）——本
# crate 消费，pi.rs 保留锁窗/反查机械。
berry-piface = { path = "../piface" }
# W3-Q5：WaitKey 值域三形（pi.rs 投影用）——crate 依赖显式化（经 sched
# re-export 的 transitive 面不可 use，Cargo 直依赖惯例）。
berry-wqmatch = { path = "../wqmatch" }
berry-telface = { path = "../telface" }
# W3-Q7：Event 信号位空间判定律单源（用户位门/置清位律/wait 命中/唤醒
# 资格）——本 crate 消费（event.rs/syscall.rs）；位值冻结面仍在 abi_gen。
berry-evface = { path = "../evface" }
# W3-Q6：intent 档位计数/通胀计数遥测纯函数面（档位直方 + inflate 数学 +
# tele: 行装配）——本 crate 消费（telemetry.rs 计数器族 + main.rs tele_dump）。
berry-itally = { path = "../itally" }
# W3-Q8：handle 位域编码单源（slot/gen 位域 + 别名拒判定律）——本
# crate 消费，handle.rs re-export。
berry-hdlface = { path = "../hdlface" }
# W3-Q9：channel 队列资格判与容量门单源（send 参数上限律/数组内无重复/
# 满队拒/空队拒/recv 容量门/READABLE·WRITABLE 派生位）——本 crate 消费
#（syscall.rs/channel.rs）；界常量值冻结面仍在 channel.rs。
berry-chanface = { path = "../chanface" }
berry-dtbface = { path = "../dtbface" }
# W3-Q15：handoff 交接几何判定律单源（probe 对齐/窗界/version 门 +
# init_segs 同页自相对/段几何 + gop 四非零门）——本 crate 消费
#（handoff.rs probe/init_segs/gop_info 判定段换消费，raw 解引用留壳）。
berry-hofface = { path = "../hofface" }
berry-vslotface = { path = "../vslotface" }
# W3-Q20：SchedAttr 位选律（默认∪覆盖/FREEZE_READY 特判）+ policy 查表
# 数学单源在 berry-polface（host 可测钉板）；本 crate process.rs re-export
# 消费（SchedAttr/SA_FLAG_* 既有路径零改动）。
berry-polface = { path = "../polface" }

[features]
# G3-3 lockdep：`cargo build --features lockdep` 出检测镜像（smoke-lockdep 面
# ——G3 草案 §3/§6 G3-3 行验收：debug 构建跑主 smoke + 误报率 <10%）。
lockdep = ["berry-sched/lockdep"]

[build-dependencies]
