[workspace]
# G-eco 编译侧（文档/G-eco编译侧设计草案.md）：用户态 crate 独立工作区——
# 不进内核 root workspace（members 显式列表）。目标沿用 builtin
# aarch64-unknown-none（stable 预编译 core，免 nightly——custom target
# 推迟到确需 target 级差异再上，草案 D1 修订）；各 bin 自带链接脚本
# （build.rs 绝对路径注入），与根 config 的 build.target 同值无冲突。
# G-eco-b 两遍构建：svcmgr include_bytes! 内嵌 echo/talker 平像（产物在
# 用户态/userbins/，gitignored）——直接整仓 `cargo build` 且无 staged 平像
# 时 svcmgr 编译期炸响（loud not silent）；编排见 justfile build-user。
# G-eco-c：berry-loader（rootfs 纯函数解析，host 测试）+ hello（首个
# rootfs 拉起程序——ELF 本体进 cpio，不走 elf2flat/include_bytes）。
# G-eco-d：berry-libc（musl std 的 libc shim——本工作区编 none target 只是
# 编译检查，真消费者 stdhello 在自己的独立小工作区编 musl target，故
# excluded；链接编排见 justfile build-user 的 std 面 pass）。
members = ["berry-sys", "berry-loader", "berry-libc", "bins/abuser", "bins/echo", "bins/hello", "bins/talker", "bins/svcmgr"]
exclude = ["bins/stdhello"]
resolver = "2"

# 用户程序平像：体积优先（单页墙由 工具链/elf2flat.py --max 执法）。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
