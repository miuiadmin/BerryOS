# BerryOS SDK/UI official-reference source manifest.
# Private-repo only. `cache/` is ignored; this file records how to reproduce it.
# Schema:
#   id          stable directory/id
#   official    authoritative human-readable entry
#   source      clone/archive source when one exists
#   license     short license verdict; always verify the in-tree file before vendoring
#   cache       link | git | sparse-git | gitiles-archive
#   enabled     true for the curated local cache; false means inventory-only for now
#   ref         branch/tag used by tools/fetch.py
#   commit      pin captured on 2026-11-11
#   paths       sparse checkout patterns (gitignore-style include patterns)

version = 1

