name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none

      - name: 安装 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: 构建（锁定依赖）
        run: cargo build --locked

      - name: 内核体积基线（12号报告 §10.1；size.py 无法运行即 CI 红——symtab 缺失时其内部降级 exit 0 只报 memsz 小计，体积数值本身无门禁）
        run: python3 工具链/size.py "$(bash 工具链/paths.sh kernel)"

      - name: 冒烟测试（QEMU 串口断言）
        run: bash 工具链/smoke.sh
