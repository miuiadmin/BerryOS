name: CI

on:
  push:
    branches: [main, wip/sched-1.1]
    # 路径分流双道（2026-11-10）：纯轻面（docs/.agents/md/tools/deny.toml）
    # 交 ci-light.yml（~2min 并行组），不进本串行重道。paths-ignore 与
    # ci-light 的 paths 对称——PR 面任一文件落在轻面外即走重道全套。
    paths-ignore: [docs/**, .agents/**, '**.md', tools/**, deny.toml]
  pull_request:
    paths-ignore: [docs/**, .agents/**, '**.md', tools/**, deny.toml]

env:
  PATH: /home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

concurrency:
  # 全局串行（2026-11-09 定案）：同机双 runner 并行 run 分抢 8 核 → TCG 互拖
  # → boot 120-360s 时序帽假红（实测 run 42653606304 与 w2 run 同跑即红）。
  # 全局单组 = 整仓同一时刻只跑一个 run，假红类根除；boot 轻面 6-8min/run
  # 串行吞吐 ~7 run/h，3 lane 推量（峰值 4-6/h）吃得下。per-ref 组弃用
  # （cancel-in-progress: false 语义并入——串行天然不取消，排队等）。
  group: ci-serial
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 入口规则门禁（fail-fast）：AGENTS 注入预算（行数/字符/行长）+ 探针
      # 串 + 雷册锚点。纯 Python，无依赖，先于工具链安装跑——防入口文件
      # 膨胀悄悄吃掉每轮上下文。
      - name: bare-conflict-markers（裸冲突标记拦截——并集解族第五犯根治）
        run: |
          if git grep -nE '^(<{7}|>{7}|={7}$)' -- '.' ':!*.lock'; then
            echo "FAIL: 树内残留裸冲突标记（<<<<<<< / ======= / >>>>>>>）——历史上 stash pop/merge 残留两次入库，污染扩散吃掉重放工"
            exit 1
          fi

      - name: docs-guard（AGENTS 注入预算 + 探针/锚点）
        run: python3 tools/docs_guard.py

      # Curia 文档面自检（fail-fast）：.agents/ + docs/ 的头块/归属/断链
      # 机械子集。零依赖 Node ≥ 18（ubuntu-latest 预装），不联网——与
      # docs-guard 并列作文档面双门禁。
      - name: check-docs（Curia 文档面：头块/归属/断链）
        run: node .agents/tools/check-docs.mjs --strict

      - name: writable-globals（可写全局清单门禁）
        run: python3 tools/writable_globals.py --check

      # 应用规范 §15.2/SDK-2-资源 §一.2「禁全类别原语」grep 守卫：公开
      # Rust 面（*.rs）出现 all-files/all-media/all-devices 式聚合入口即
      # FAIL——词表闭集外新词必须过评审，防 scoped-storage 十年返工课重演。
      # git grep 只扫跟踪文件（cargo-target 构建产物里 uucore 帮助文本
      # ls-help-all-files 假阳首跑实抓）——docs/research 立法原文合法存在
      # 这些词，故只 *.rs。
      - name: 全类别原语 grep 守卫（禁 all-files/all-media/all-devices）
        run: |
          if git grep -nE 'all[-_]files|all[-_]media|all[-_]devices' -- '*.rs'; then
            echo "FAIL: 发现全类别原语（应用规范 §2.3/SDK-2-资源 §一）——树级/句柄粒度是唯一单位，聚合语法必须过评审立法"
            exit 1
          fi

      - name: ver-check（版本管理标准 §3 G-ver-3/4 脚本门）
        run: |
          git fetch --prune --prune-tags --tags origin
          bash tools/ver-check.sh

      - name: 工具链就位检查（runner 机预装面）
        run: |
          rustc --version
          rustup target list --installed | grep -cE 'aarch64-unknown-none|aarch64-unknown-linux-musl|x86_64-unknown-none'
          qemu-system-aarch64 --version | head -1
          # x86_64 模拟器：PATH 缺则查 brew 前缀（冒烟步同链——env.PATH 不含
          # brew bin，aarch64 靠 /usr/local/bin 链接过检而 x86_64 无链接）。
          command -v qemu-system-x86_64 >/dev/null 2>&1 \
            || [ -x /home/linuxbrew/.linuxbrew/bin/qemu-system-x86_64 ] \
            || { echo "FAIL: qemu-system-x86_64 缺席（PATH 与 brew 前缀均无——按 docs/命令速览.md 补装）"; exit 1; }
          just --version

      # QEMU ≥10 必须（非安全第二 PL011 0x09040000 是 QEMU 10.0 新增；8.2
      # 下第二个 -serial 只建 chardev 不建设备 → RX 相 uart1_init external
      # abort）。runner 机 brew 预装 11.0.3，安装步退役。

      # just 复用 justfile 单一入口（与本地同配方）——runner 机预装，安装步退役。

      # ---------- SEC-01 §4.5 件 23：供应链防线进 CI（fail-fast 位） ----------
      # cargo-deny：licenses（GPL 拒收 = 仓纪律执法，allowlist 见根 deny.toml——
      # 依据 = 全 workspace cargo metadata 实测 license 面）+ advisories（RustSec
      # 三连击教训，SEC-8 §3.4）。本仓多 workspace（find 口径 27 个 manifest 命中
      # ——根/user/drivers/bootloader/x86_64/user bins；23 个真 [workspace] 根 +
      # 4 个注释命中假根（vblk/vnet/vprobe/berry-tcp——cargo deny 经 --manifest-path
      # 解析到所属父 workspace，检查面等价；26→27 = A5-1 netprobe 独立小工作区
      # 增补）），逐一 --manifest-path 全覆盖；find 排除 reference/ .claude/
      # target/ docs/（docs/挂账-* 是死档部分树，manifest 断链非可检查对象）。
      # SEC-02 挂账 F1 清账（2026-10-30）：全部本地 crate 补齐
      # `license = "Apache-2.0"`（ADR #37）后撤 `-A unlicensed -A no-license-field`
      # 双旗（本地 27 manifest 全绿实录）——「缺 license 字段/无表达式」面恢复
      # FAIL 执法，第三方依赖缺字段不再整类静默放行（详见 deny.toml 头注）。
      # 版本钉 0.20.2（与本地验证同版）。
      - name: cargo-deny（licenses + advisories，全 workspace）
        run: |
          set -eu
          fails=0
          for mf in $(find . -name Cargo.toml -not -path './reference/*' -not -path './.claude/*' -not -path './target/*' -not -path './docs/*' | sort); do
            grep -q '\[workspace\]' "$mf" || continue
            echo "::group::cargo-deny $mf"
            if ! cargo deny --config deny.toml --manifest-path "$mf" check licenses advisories; then
              echo "::error file=$mf::cargo-deny licenses/advisories FAILED（GPL 误入或 RustSec 命中——see deny.toml）"
              fails=$((fails+1))
            fi
            echo "::endgroup::"
          done
          test "$fails" -eq 0

      # SEC-02 A2：berry-ksproto host 测试门禁（协议 crate 家族纪律——
      # psproto/netdproto 同族第三席；对抗审查实抓 justfile test-host 未接线
      # = 20 测零自动执法、静默腐烂）。justfile test-host 接线随兄弟 WIP
      # 解冻由主会话补线，CI 先挂 fail-fast 位补上执法面。显式 --target 覆盖
      # 根 .cargo/config.toml 锁的 build.target=aarch64-unknown-none（config
      # 发现跨 workspace 边界仍命中——Gotcha；host 测试须点名 host 三元组）；
      # 零依赖零网络，ubuntu runner host 目标预装。
      - name: berry-ksproto host 测试（SEC-02 A2 协议 crate 门禁）
        run: cargo test --manifest-path user/berry-ksproto/Cargo.toml --target x86_64-unknown-linux-gnu

      # A7-1：berry-mmap host 测试门禁（ksproto 同款纪律——纯函数 crate 家族
      # 的测试面必须挂 CI 执法，防「host 测零自动执法、静默腐烂」；user/
      # workspace 成员经 --manifest-path 点名 + 显式 host 三元组覆盖根
      # config 的 build.target 锁；零依赖零网络）。
      - name: berry-mmap host 测试（A7-1 纯函数 crate 门禁）
        run: cargo test --manifest-path user/berry-mmap/Cargo.toml --target x86_64-unknown-linux-gnu

      # A7-4：berry-signal host 测试门禁（ksproto/mmap 同款纪律——纯函数
      # crate 家族的测试面必须挂 CI 执法；justfile test-host 已接线，CI
      # fail-fast 位同面补上——零依赖零网络）。
      - name: berry-signal host 测试（A7-4 纯函数 crate 门禁）
        run: cargo test --manifest-path user/berry-signal/Cargo.toml --target x86_64-unknown-linux-gnu

      # ---------- SDK-1b：发布族十 crate publish 守卫（fail-fast 位） ----------
      # 三档执法，档位由 2026-10-30 双轮实测定死（基线 B2/B3/B4/B6 + 沙箱
      # E1–E3，docs/SDK-1b实施设计草案.md §1.2/§5）：
      # ① grep 硬门：cargo package/--list 对「内部依赖必须带 version」（path-only
      #    照样过 --list）与「description/license 等六键齐备」（缺键只 warning
      #    不 fail）都不执法——grep 是唯一硬门，防 path-only 回归静默过 CI、
      #    爆在用户 cargo publish 当场；
      # ② 八叶子（零内部依赖）完整 cargo package——verification build 对
      #    aarch64-unknown-none（根 config target 锁跨 workspace 边界命中）=
      #    真实发布面可打包（基线 B2 实证）；
      # ③ 中/顶层（fsclient/libc）双写依赖在叶子真发布到 crates.io 前结构性
      #    不可本地全链（tarball 生成即剥 path → registry 解析前置，--no-verify
      #    也不绕，B6 实证）——只跑 --list（registry-free，E1 实证）保文件清单
      #    干净面。叶子发布后本档升级为完整 package（另刀回填，勿现在改）。
      - name: sdk-publish-guard（SDK-1b 十 crate 发布面守卫）
        working-directory: user
        run: |
          set -eu
          # —— 硬门 1：十 crate 元数据齐备（version/description/license/
          #    repository/readme 字段 + README 本体在位）。
          for c in berry-sys berry-tls berry-netdproto berry-fsproto berry-mmap berry-signal berry-lifecycle berry-strmem berry-fsclient berry-libc; do
            m="$c/Cargo.toml"
            grep -q '^version = "0.1.0"' "$m"      || { echo "::error file=$m::version 应为 0.1.0"; exit 1; }
            grep -q '^description = ' "$m"         || { echo "::error file=$m::缺 description"; exit 1; }
            grep -q '^license = "Apache-2.0"' "$m" || { echo "::error file=$m::license 应为 Apache-2.0"; exit 1; }
            grep -q '^repository = ' "$m"          || { echo "::error file=$m::缺 repository"; exit 1; }
            grep -q '^readme = "README.md"' "$m"   || { echo "::error file=$m::缺 readme 字段"; exit 1; }
            test -f "$c/README.md"                 || { echo "::error file=$m::README.md 缺席"; exit 1; }
          done
          # —— 硬门 2：内部依赖双写形恰一（path + version 同行；依赖行上方
          #    注释不拦，行本体逐字节钉死）。
          dw() {  # dw <manifest> <dep>
            grep -q "^$2 = { path = \"../$2\", version = \"0.1.0\" }$" "$1" \
              || { echo "::error file=$1::依赖 $2 应为 { path = \"../$2\", version = \"0.1.0\" } 双写形"; exit 1; }
          }
          dw berry-fsclient/Cargo.toml berry-sys
          dw berry-fsclient/Cargo.toml berry-fsproto
          dw berry-fsclient/Cargo.toml berry-netdproto
          dw berry-libc/Cargo.toml berry-sys
          dw berry-libc/Cargo.toml berry-fsclient
          dw berry-libc/Cargo.toml berry-tls
          dw berry-libc/Cargo.toml berry-netdproto
          # A7-1：libc 第 5 条内部依赖（mmap 簿记纯面——first-fit 窗算术 + region 表）。
          dw berry-libc/Cargo.toml berry-mmap
          # A7-4：libc 第 6 条内部依赖（POSIX 信号面纯函数底座——表/掩码/
          # sigset 位图/投递分诊；libc signal.rs 消费）。
          dw berry-libc/Cargo.toml berry-signal
          # app-2 刀1：libc 第 7 条内部依赖（生命周期三口纯函数底座——32B blob
          # 容器 v1 codec；libc lifecycle 封装消费）。
          dw berry-libc/Cargo.toml berry-lifecycle
          # W1 #113：libc 第 8 条内部依赖（mem/str 族语义单源——volatile
          # 拷/填/memmove + 字节序比较/扫描 + strncpy pad-to-n + atoi 双饱和；
          # libc strmem.rs 薄 #[no_mangle] 壳消费）。
          dw berry-libc/Cargo.toml berry-strmem
          # —— 硬门 2b：path 依赖反向执法（双镜头审查 F1，2026-10-30）。
          #    dw() 只正向钉十一条已知线在位；此处反向兜两条：
          #    ① path-only 形零容忍——任何「有 path 无 version」依赖线当场红
          #       （防未来加线/改形去 version 静默过 CI、爆在 publish
          #       当天「path dependency without a version」）；
          #    ② path 行计数钉死——fsclient=3 / libc=8 / 八叶子=0；任何改形
          #       （去 version、转 TOML 表形、加线）计数必漂移即红；有意加线
          #       须同步本定值与 dw()（同步律）。
          if grep -nE '= \{ path = "[^"]+"[[:space:]]*\}$' \
              berry-sys/Cargo.toml berry-tls/Cargo.toml berry-netdproto/Cargo.toml \
              berry-fsproto/Cargo.toml berry-mmap/Cargo.toml berry-signal/Cargo.toml \
              berry-lifecycle/Cargo.toml berry-strmem/Cargo.toml \
              berry-fsclient/Cargo.toml berry-libc/Cargo.toml
          then
            echo "::error::发布族十 manifest 存在 path-only 依赖线（= { path = … } 无 version）"
            exit 1
          fi
          pc() {  # pc <manifest> <期望 path 行数>（grep -c 零命中退出码 1，|| true 吞）
            n=$(grep -cE '= \{ path = ' "$1" || true)
            [ "$n" = "$2" ] || { echo "::error file=$1::path 依赖线计数 $n ≠ 期望 $2（加线/改形须同步 dw/pc 定值）"; exit 1; }
          }
          pc berry-sys/Cargo.toml 0
          pc berry-tls/Cargo.toml 0
          pc berry-netdproto/Cargo.toml 0
          pc berry-fsproto/Cargo.toml 0
          pc berry-mmap/Cargo.toml 0
          pc berry-signal/Cargo.toml 0
          pc berry-lifecycle/Cargo.toml 0
          pc berry-strmem/Cargo.toml 0
          pc berry-fsclient/Cargo.toml 3
          pc berry-libc/Cargo.toml 8
          # —— 档 ②：八叶子完整 package（含 verification build；rustflags
          #    -fp-armv8/-neon 弃用告警为已知噪声（基线 B2），非失败）。
          for c in berry-sys berry-tls berry-netdproto berry-fsproto berry-mmap berry-signal berry-lifecycle berry-strmem; do
            echo "::group::cargo package -p $c"
            cargo package -p "$c"
            echo "::endgroup::"
          done
          # —— 档 ③：中/顶层 --list（registry-free 文件清单干净面）。
          cargo package --list -p berry-fsclient
          cargo package --list -p berry-libc

      # just build = abi-check + build-user + cargo build。曾直接 `cargo build
      # --locked`：跳过 build-user 则 kernel/src/userbins/*.bin（gitignored 编译
      # 产物，内核 include_bytes! 直嵌）缺席 → 编译期炸响 exit 101——CI 连红 5
      # 天的根因（缺产物 loud not silent 是设计，CI 面须先走产物链）。
      # 共享 target 缓存（2026-11-10）：双 runner 各自 workspace 的 target 零缓存
      # = 每次 run 近全量重建（实测 322s vs 1185s 3.7 倍波动）。软链到共享
      # 位（777，两 runner 用户等价读写），增量构建复用跨 run 编译产物。
      # 注意：不缓存 root .cargo/registry（已 symlink 共享位）——只共享编译产物。
      - name: 共享 target 缓存挂载
        run: |
          # 目录 root 预建（runner:berry-ci 2775——runner 用户属主 + berry-ci 组写），
          # mkdir -p 幂等不报错；不再 chmod（非属主 chmod 会红）。
          mkdir -p /usr/local/share/cargo-target-cache
          rmdir target 2>/dev/null || rm -rf target
          ln -sfn /usr/local/share/cargo-target-cache target

      - name: 构建（内核 + 用户程序产物链）
        run: just build

      # K-2：ARM64 内核 release 链接守卫——release 优化才生成的引用形态（.text.boot
      # ADRP 引 .rodata.cst16 越 ±4GB）断链而 debug 全绿，此前 CI 零覆盖结构性
      # 不可见（唯二 release 面 = x86 工作区与 build-user 内部）。置于 just build
      # 后 = userbins 热缓存、build-user 增量 no-op；只构建不跑 QEMU。
      - name: 构建 release（链接守卫）
        run: just build-release

      - name: 内核体积基线（12号报告 §10.1；size.py 无法运行即 CI 红——symtab 缺失时其内部降级 exit 0 只报 memsz 小计，体积数值本身无门禁）
        run: just size

      - name: ARM64 冒烟四跑（QEMU 串口断言：裸相 + rootfs 相 + RX 交互相 + FAT 持久化相）
        env:
          SMOKE_PHASES: boot
          # 同机多 run 并行分抢核 → TCG 拖慢（boot 120s 本地帽在 CI 并行态不够），
          # CI 放宽到 360（帽哲学：只兜结构性挂死不赌快）。
          SMOKE_DEADLINE_BOOT: '360'
        run: just smoke

      # ---------- P7-x4 五原语收官 gate：x86_64 最小集挂 CI ----------
      # x86 独立小工作区（不入根 workspace），cargo 直调（与 justfile build-x86
      # 同参；--locked 可用——工作区 Cargo.lock 已入册）。
      - name: 构建 x86_64 最小集（五原语收官 gate）
        run: |
          cd arch/x86_64
          CARGO_TARGET_DIR=cargo-target cargo build --release --locked --target x86_64-unknown-none

      - name: x86_64 最小集冒烟（五原语收官 gate）
        # QEMU x86_64 解析回退链：PATH → Linuxbrew 前缀。工作流 env.PATH 为
        # rustc 修正收窄（32b381e）不含 brew bin；aarch64 侧靠 /usr/local/bin
        # 符号链接过就位检查，x86_64 无链接（#40 CI 红实证：runner berry-linux-x64-1
        # brew qemu 11.0.3 全家桶含 qemu-system-x86_64，仅前缀未入 PATH）。
        # brew 前缀有即经 QEMU 环境变量注入（smoke-x86.sh:40 原生面）；无则
        # 不注入，由脚本 43 行缺件 loud 红——门禁不降级。
        run: |
          BREW_BIN=/home/linuxbrew/.linuxbrew/bin
          if [ -x "$BREW_BIN/qemu-system-x86_64" ]; then
            echo "smoke-x86: 用 brew qemu（$BREW_BIN/qemu-system-x86_64）"
            export QEMU="$BREW_BIN/qemu-system-x86_64"
          else
            echo "smoke-x86: brew 前缀无 qemu-system-x86_64，交 PATH 解析（缺件将 loud 红）"
          fi
          unshare -Urn sh -c 'ip link set lo up && exec bash tools/smoke-x86.sh "arch/x86_64/cargo-target/x86_64-unknown-none/release/berry-x86"'

      # ---------- V-4 M-G1 gate：img-boot 独立冒烟（AAVMF 挂盘自举） ----------
      # just 单一入口（recipe 依赖 image = build + build-boot + mkimage 全链）；
      # AAVMF 路径环境变量覆盖 justfile 的 brew 默认（Ubuntu qemu-efi-aarch64
      # 包布局 = /usr/share/AAVMF/，对抗审查 F1 实证）。EFI 引导 ~115s（TCG）
      # + 注入段，帽内余量 ~3x。
      - name: img-boot 冒烟（M-G1 gate）
        # 分层 CI：img-boot 同款 boot 轻面（PR #43）——EFI 十段+接续+裸相 32
        # 45 标记慢机可达（服务器实测绿），生态 39 服务链留快机。
        env:
          SMOKE_PHASES: boot
          AAVMF_CODE: /home/linuxbrew/.linuxbrew/share/qemu/AAVMF-shared/edk2-aarch64-code.fd
          AAVMF_VARS: /home/linuxbrew/.linuxbrew/share/qemu/AAVMF-shared/edk2-arm-vars.fd
        run: unshare -Urn sh -c 'ip link set lo up && exec just smoke-image'

      # ---------- SEC-01 §4.5 件 22 + 件 23 尾面（CI/台账） ----------
      # 镜像哈希清单：smoke-image 依赖链（just image → mkimage）已产
      # out/manifest.txt（件 3/A1 本刀落地——mkimage 无条件写 <img> 同目录侧
      # 产物），本步 cat 公示其哈希清单；exists 判断保留为 image 产链退化时的
      # 宽容面（别因缺席红 CI）。
      - name: 镜像产物清单（SEC-01 §4.5 件 3/A1）
        run: |
          if [ -f out/manifest.txt ]; then
            echo "== out/manifest.txt =="
            cat out/manifest.txt
          else
            echo "out/manifest.txt 缺席（smoke-image 依赖链未产出——image 产链退化面，本步宽容不红）"
          fi

      # unsafe 台账守卫（mkfat --check-fixture 同型）：源码 unsafe 面与
      # docs/unsafe台账.md 双向对拍——新增/移行/删减 unsafe 而忘重产即红；
      # 密度趋势线 = 台账文档的 git 史。
      - name: unsafe 台账对拍（SEC-01 §4.5 件 22）
        run: python3 tools/unsafe_audit.py --check
