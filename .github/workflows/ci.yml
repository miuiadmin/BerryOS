name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64-unknown-none：内核 + no_std 用户程序；aarch64-unknown-linux-musl：
          # G-eco-d std 面（stdhello/hexyl/bsh/fail/fsmgr/vprobe/vblk/vnet——berry-libc
          # shim + berry-ld 链）；x86_64-unknown-none：P7 x86_64 最小集（ADR #41）。
          targets: aarch64-unknown-none, aarch64-unknown-linux-musl, x86_64-unknown-none

      - name: 安装 QEMU
        run: |
          sudo apt-get update
          # qemu-efi-aarch64 = AAVMF 固件对。注意布局：Ubuntu/Debian 包落
          # /usr/share/AAVMF/AAVMF_CODE.fd + AAVF_VARS.fd（2024.02 起；
          # 真实 deb 解包钉死——/usr/share/qemu/edk2-*.fd 是 brew/Fedora 布局，
          # CI 写错路径 = 关卡结构性必红）。
          sudo apt-get install -y qemu-system-arm qemu-system-x86 qemu-efi-aarch64

      # 装 just 复用 justfile 单一入口（build/smoke 全走与本地同一配方——防 CI
      # 自带第二套 cargo 命令与 justfile 分叉；P7-x4 挂账清偿）。
      - name: 安装 just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # just build = abi-check + build-user + cargo build。曾直接 `cargo build
      # --locked`：跳过 build-user 则 kernel/src/userbins/*.bin（gitignored 编译
      # 产物，内核 include_bytes! 直嵌）缺席 → 编译期炸响 exit 101——CI 连红 5
      # 天的根因（缺产物 loud not silent 是设计，CI 面须先走产物链）。
      - name: 构建（内核 + 用户程序产物链）
        run: just build

      # K-2：ARM64 内核 release 链接守卫——release 优化才生成的引用形态（.text.boot
      # ADRP 引 .rodata.cst16 越 ±4GB）断链而 debug 全绿，此前 CI 零覆盖结构性
      # 不可见（唯二 release 面 = x86 工作区与 build-user 内部）。置于 just build
      # 后 = userbins 热缓存、build-user 增量 no-op；只构建不跑 QEMU。
      - name: 构建 release（链接守卫）
        run: just build-release

      - name: 内核体积基线（12号报告 §10.1；size.py 无法运行即 CI 红——symtab 缺失时其内部降级 exit 0 只报 memsz 小计，体积数值本身无门禁）
        run: just size

      - name: ARM64 冒烟四跑（QEMU 串口断言：裸相 + rootfs 相 + RX 交互相 + FAT 持久化相）
        run: just smoke

      # ---------- P7-x4 五原语收官 gate：x86_64 最小集挂 CI ----------
      # x86 独立小工作区（不入根 workspace），cargo 直调（与 justfile build-x86
      # 同参；--locked 可用——工作区 Cargo.lock 已入册）。
      - name: 构建 x86_64 最小集（五原语收官 gate）
        run: |
          cd arch/x86_64
          CARGO_TARGET_DIR=cargo-target cargo build --release --locked --target x86_64-unknown-none

      - name: x86_64 最小集冒烟（五原语收官 gate）
        run: bash tools/smoke-x86.sh "arch/x86_64/cargo-target/x86_64-unknown-none/release/berry-x86"

      # ---------- V-4 M-G1 gate：img-boot 独立冒烟（AAVMF 挂盘自举） ----------
      # just 单一入口（recipe 依赖 image = build + build-boot + mkimage 全链）；
      # AAVMF 路径环境变量覆盖 justfile 的 brew 默认（Ubuntu qemu-efi-aarch64
      # 包布局 = /usr/share/AAVMF/，对抗审查 F1 实证）。EFI 引导 ~115s（TCG）
      # + 注入段，帽内余量 ~3x。
      - name: img-boot 冒烟（M-G1 gate）
        run: just smoke-image
        env:
          AAVMF_CODE: /usr/share/AAVMF/AAVMF_CODE.fd
          AAVMF_VARS: /usr/share/AAVMF/AAVMF_VARS.fd
