[package]
name = "berryboot"
# L-SYS 0.2.0：字面版本不走 workspace 继承（独立小 workspace，版本治理
# 规则/14；berry-efi 同批同值）。升版 = 逐 crate 手同步（本工作区两件）。
version = "0.2.0"
edition = "2021"
description = "BerryBoot EFI 引导应用（V-0a）——staticlib 出 ELF，tools/elf2pe 转 PE32+"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
berry-efi = { path = "../berry-efi" }
# V-0b 刀 2：引导视图解析（p_paddr 口径）——纯函数 crate 跨user/引导
# 两界复用，库本体 no_std 直接进 EFI staticlib 链。
berry-loader = { path = "../../../user/berry-loader" }
# P3 boot 期验签：ed25519 verify + SHA-512/256 度量（host/none 双面
# crate——lib cfg_attr no_std，EFI app = host 环境语境可链；berry-loader
# 跨界先例同款）。消费面 = 本 crate 验签块（KERNEL.ELF 全字节 verify +
# digest256 填 V10 meas_root 槽）。
berry-crypto = { path = "../../../user/berry-crypto" }
# G0 刀 1：A/B 槽位仲裁纯面（跨界共享）。
berry-slot = { path = "../slot" }
